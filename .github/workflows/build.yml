          package com.altintas.faturasms;

          import java.util.ArrayList;
          import java.util.List;
          import java.util.Locale;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          /**
           * SMS ve mail metinlerinden fatura / borç bilgisini çıkarır. Android'e bağımlı değil (masaüstünde test edilebilir).
           */
          public final class Parser {
              private Parser() {}

              /** Bir metinden çıkan sonuç. kind: "bill" (fatura), "debt" (borç hatırlatması), "info" (bilgi). */
              public static final class Item {
                  public String kind = "bill";
                  public String type = "diger";      // elektrik | su | dogalgaz | diger
                  public String provider = "";
                  public String aboneNo = "";
                  public double amount = -1;
                  public String dueDate = "";       // YYYY-MM-DD
                  public String period = "";        // YYYY-MM
                  public String link = "";
                  public String text = "";
                  public Double consumption = null;
                  public String unit = "";
                  public String addr = "";
                  public String invNo = "";
                  public boolean noPay = false;
                  public java.util.Map<String, String> det = null;

                  @Override public String toString() {
                      return kind + " " + type + " " + provider + " #" + aboneNo + " " + amount + " TL son:" + dueDate + " dönem:" + period
                              + (link.isEmpty() ? "" : " link") + (consumption != null ? " tük:" + consumption : "");
                  }
              }

              static final String[] AYLAR = {"ocak", "subat", "mart", "nisan", "mayis", "haziran", "temmuz", "agustos", "eylul", "ekim", "kasim", "aralik"};

              /* ---------------- yardımcılar ---------------- */

              /** Türkçe sayı: "1.235,80" "3530.00" "22015" "512,00" → double */
              public static double num(String s) {
                  if (s == null) return -1;
                  s = s.trim().replace(" ", "");
                  if (s.isEmpty()) return -1;
                  int c = s.lastIndexOf(','), d = s.lastIndexOf('.');
                  if (c >= 0 && d >= 0) {
                      if (c > d) s = s.replace(".", "").replace(',', '.');
                      else s = s.replace(",", "");
                  } else if (c >= 0) {
                      s = s.replace(',', '.');
                  } else if (d >= 0) {
                      // "22.015" binlik mi ondalık mı? Noktadan sonra tam 3 hane ve tek nokta → binlik
                      String after = s.substring(d + 1);
                      if (after.length() == 3 && s.indexOf('.') == d) s = s.replace(".", "");
                      else if (s.indexOf('.') != d) s = s.replace(".", "");
                  }
                  try { return Double.parseDouble(s); } catch (Exception e) { return -1; }
              }

              /** "21-09-2026", "04/09/2026", "7. 9.2026", "05.11.2026" → "2026-09-21" */
              public static String date(String s) {
                  if (s == null) return "";
                  Matcher m = Pattern.compile("(\\d{1,2})\\s*[./-]\\s*(\\d{1,2})\\s*[./-]\\s*(\\d{4})").matcher(s);
                  if (!m.find()) return "";
                  int g = Integer.parseInt(m.group(1)), a = Integer.parseInt(m.group(2));
                  if (a < 1 || a > 12 || g < 1 || g > 31) return "";
                  return m.group(3) + "-" + two(a) + "-" + two(g);
              }

              static String two(int v) { return v < 10 ? "0" + v : String.valueOf(v); }

              static String firstLink(String t) {
                  Matcher m = Pattern.compile("https?://[^\\s)\\]\"'<>]+").matcher(t);
                  while (m.find()) {
                      String u = m.group().replaceAll("[.,;]+$", "");
                      String l = u.toLowerCase(Locale.ROOT);
                      if (l.contains("unsubscribe") || l.contains("facebook") || l.contains("twitter") || l.contains("instagram")
                              || l.contains("apps.apple") || l.contains("play.google") || l.endsWith(".png") || l.endsWith(".jpg") || l.endsWith(".gif"))
                          continue;
                      if (l.matches("https?://(www\\.)?[a-z.]+/?") ) continue; // sadece ana sayfa
                      return u;
                  }
                  return "";
              }

              static String find(String re, String t) {
                  Matcher m = Pattern.compile(re, Pattern.CASE_INSENSITIVE | Pattern.UNICODE_CASE).matcher(t);
                  return m.find() ? m.group(1) : null;
              }

              static String providerOf(String from, String t) {
                  String f = BillFilter.norm(from + " " + t);
                  if (f.contains("turkcell")) return "Turkcell";
                  if (f.contains("turk telekom") || f.contains("turktelekom") || f.contains("tt mobil")) return "Türk Telekom";
                  if (f.contains("ckbogazici") || f.contains("ck enerji") || f.contains("ck bogazici") || f.contains("ckenerji")) return "CK Boğaziçi";
                  if (f.contains("aksa coruh") || f.contains("coruh") || f.contains("aksacoruh")) return "AKSA Çoruh Elektrik";
                  if (f.contains("aksa") && (f.contains("gaz") || f.contains("dogalgaz"))) return "AKSA Doğalgaz";
                  if (f.contains("igdas")) return "İGDAŞ";
                  if (f.contains("tiski")) return "TİSKİ";
                  if (f.contains("iski")) return "İSKİ";
                  if (f.contains("enerjisa")) return "Enerjisa";
                  if (f.contains("bedas")) return "BEDAŞ";
                  if (f.contains("aksa")) return "AKSA";
                  String s = from == null ? "" : from.trim();
                  return s.matches("[+0-9 ]+") ? "" : s;
              }

              static String typeOf(String provider, String t) {
                  String p = BillFilter.norm(provider), n = BillFilter.norm(t);
                  if (p.contains("turkcell") || p.contains("telekom")) return "diger";
                  if (p.contains("igdas") || p.contains("dogalgaz") || n.contains("dogalgaz") || n.contains("dogal gaz")) return "dogalgaz";
                  if (p.contains("iski") || p.contains("tiski") || p.contains("su ") || n.contains(" su faturasi") || n.contains("m3")) return "su";
                  if (p.contains("ck") || p.contains("elektrik") || p.contains("enerjisa") || p.contains("bedas") || n.contains("elektrik") || n.contains("kwh")) return "elektrik";
                  return "diger";
              }

              /* ---------------- SMS ---------------- */

              /** SMS metnini çözer. Fatura/borç değilse null. */
              public static Item sms(String from, String body) {
                  if (body == null) return null;
                  if (!BillFilter.isBill(from, body)) return null;
                  return text(from, "", body);
              }

              /**
               * Genel metin çözücü (SMS gövdesi ya da mail gövdesi). subject mail konusudur (SMS için boş).
               */
              public static Item text(String from, String subject, String body) {
                  String t = (subject == null ? "" : subject + "\n") + body;
                  String n = BillFilter.norm(t);
                  Item it = new Item();
                  it.provider = providerOf(from, t);
                  it.type = typeOf(it.provider, t);
                  it.link = firstLink(body);
                  it.text = body.replaceAll("\\s+", " ").trim();
                  if (it.text.length() > 300) it.text = it.text.substring(0, 300) + "…";

                  // Abone / hesap / hat numarası
                  String ab = find("(\\d{6,13})\\s*(?:nolu|no'lu|no’lu|numaral[ıi]|no\\b|nolu)", t);
                  if (ab == null) ab = find("(?:hesap|abone|tesisat|s[öo]zle[şs]me(?: hesab[ıi])?)\\s*(?:no|numaras[ıi])?\\s*[:.]?\\s*(\\d{6,13})", t);
                  if (ab == null && "Turkcell".equals(it.provider)) ab = find("(5\\d{9})\\s*Turkcell", t);
                  if (ab == null && "Turkcell".equals(it.provider)) ab = find("\\b(5\\d{9})\\b", t);
                  if (ab != null) it.aboneNo = ab;

                  // Son ödeme tarihi
                  String due = null;
                  Matcher m = Pattern.compile("(\\d{1,2}\\s*[./-]\\s*\\d{1,2}\\s*[./-]\\s*\\d{4})\\s*(?:'?\\s*(?:dir|tir|d[ıi]r|t[ıi]r))?\\s*(?:son\\s*[öo]deme)", Pattern.CASE_INSENSITIVE | Pattern.UNICODE_CASE).matcher(t);
                  if (m.find()) due = m.group(1);
                  if (due == null) due = find("son\\s*[öo]deme\\s*tarih[i]?\\s*[:]?\\s*(?:yar[ıi]n olan\\s*)?(\\d{1,2}\\s*[./-]\\s*\\d{1,2}\\s*[./-]\\s*\\d{4})", t);
                  if (due == null) due = find("son\\s*[öo]deme\\s*tarihi\\s*(\\d{1,2}[./-]\\d{1,2}[./-]\\d{4})", t);
                  if (due != null) it.dueDate = date(due);

                  // Tutar: önce "ödenmesi gereken / ödenecek" tutarı
                  String a = find("[öo]denmesi gereken fatura tutar[ıi]\\s*([\\d.,]+)\\s*TL", t);
                  if (a == null) a = find("[öo]denecek tutar\\s*[:]?\\s*([\\d.,]+)\\s*TL", t);
                  if (a == null) a = find("fatura tutar[ıi]\\s*[:]?\\s*([\\d.,]+)\\s*TL", t);
                  if (a == null) a = find("son odeme tarihli\\s*([\\d.,]+)\\s*TL", t);
                  if (a == null) a = find("([\\d.,]+)\\s*TL\\s*tutar[ıi]nda", t);
                  if (a == null) a = find("toplam\\s*([\\d.,]+)\\s*(?:TL)?\\s*tutar", t);
                  if (a == null) a = find("([\\d.,]+)\\s*TL'?lik faturalar", t);
                  if (a == null) a = find("([\\d][\\d.,]*)\\s*(?:TL|TRY)\\b", t);
                  if (a != null) it.amount = num(a);

                  // Dönem
                  Matcher pm = Pattern.compile("(\\d{4})\\s+(ocak|şubat|subat|mart|nisan|mayıs|mayis|haziran|temmuz|ağustos|agustos|eylül|eylul|ekim|kasım|kasim|aralık|aralik)\\s+d[öo]nemi", Pattern.CASE_INSENSITIVE | Pattern.UNICODE_CASE).matcher(t);
                  if (pm.find()) it.period = pm.group(1) + "-" + two(monthIdx(pm.group(2)) + 1);
                  if (it.period.isEmpty()) {
                      Matcher am = Pattern.compile("(ocak|şubat|subat|mart|nisan|mayıs|mayis|haziran|temmuz|ağustos|agustos|eylül|eylul|ekim|kasım|kasim|aralık|aralik)\\s+ay[ıi]na ait", Pattern.CASE_INSENSITIVE | Pattern.UNICODE_CASE).matcher(t);
                      if (am.find() && !it.dueDate.isEmpty()) {
                          int mo = monthIdx(am.group(1)) + 1, y = Integer.parseInt(it.dueDate.substring(0, 4));
                          if (mo > Integer.parseInt(it.dueDate.substring(5, 7))) y--;
                          it.period = y + "-" + two(mo);
                      }
                  }

                  // Tür: borç hatırlatması mı?
                  boolean debt = n.contains("odenmemis") || n.contains("odenmedi") || n.contains("borcunuz bulunmaktadir")
                          || n.contains("henuz odenmedigini") || n.contains("borc bilgilendirme") || n.contains("son odeme tarihi gecmis")
                          || n.contains("faturaniz odenmemistir") || n.contains("faturanizin odenmedigini") || n.contains("adet fatura borcu")
                          || n.contains("tarihi yarin olan");
                  boolean bill = n.contains("faturaniz icin") || n.contains("fatura detay") || n.contains("faturanizin son odeme")
                          || n.contains("odenmesi gereken fatura tutari") || n.contains("faturaniza ulasmak") || n.contains("faturaniz duzenlen")
                          || n.contains("fatura tutari") || n.contains("donemi faturanizin") || n.contains("faturanizi goruntule");
                  boolean strongDebt = n.contains("son odeme tarihi gecmis") || n.contains("henuz odenmedigini") || n.contains("faturaniz odenmemistir")
                          || n.contains("faturanizin odenmedigini") || n.contains("borcunuz bulunmaktadir") || n.contains("adet fatura borcu");
                  if (strongDebt) it.kind = "debt";
                  else if (debt && !bill) it.kind = "debt";
                  else if (!bill && it.amount < 0) it.kind = "info";
                  else if (!bill) it.kind = debt ? "debt" : "bill";

                  if ("bill".equals(it.kind)) {
                      if (it.amount <= 0 || it.dueDate.isEmpty()) {
                          // eksik bilgili fatura: bilgi olarak tut
                          if (it.amount > 0 || !it.dueDate.isEmpty()) it.kind = "bill"; else it.kind = "info";
                      }
                      if (it.period.isEmpty() && !it.dueDate.isEmpty()) it.period = guessPeriod(it.dueDate);
                  }
                  if (n.contains("tuketim olmadigi icin") || n.contains("fatura kesilmedi")) { it.kind = "info"; it.amount = -1; }
                  it.unit = "elektrik".equals(it.type) ? "kWh" : ("su".equals(it.type) || "dogalgaz".equals(it.type)) ? "m³" : "";
                  return it;
              }

              static int monthIdx(String s) {
                  String n = BillFilter.norm(s);
                  for (int i = 0; i < 12; i++) if (n.startsWith(AYLAR[i].substring(0, 3))) return i;
                  return 0;
              }

              /** Son ödeme tarihinden dönem tahmini: son ödeme ayın 10'undan önceyse önceki ay. */
              static String guessPeriod(String due) {
                  int y = Integer.parseInt(due.substring(0, 4)), m = Integer.parseInt(due.substring(5, 7)), d = Integer.parseInt(due.substring(8, 10));
                  if (d < 10) { m--; if (m == 0) { m = 12; y--; } }
                  return y + "-" + two(m);
              }

              /* ---------------- CK e-fatura UBL (XML) ---------------- */

              /** CK UBL XML'inden fatura. Not alanları "Anahtar:Değer" biçimindedir. */
              public static Item ubl(String xml) {
                  Item it = new Item();
                  it.provider = "CK Boğaziçi";
                  it.type = "elektrik";
                  it.unit = "kWh";
                  java.util.Map<String, String> notes = new java.util.LinkedHashMap<>();
                  Matcher m = Pattern.compile("<cbc:Note>([^<]*)</cbc:Note>").matcher(xml);
                  while (m.find()) {
                      String v = unesc(m.group(1));
                      int i = v.indexOf(':');
                      if (i > 0) notes.put(v.substring(0, i).trim(), v.substring(i + 1).trim());
                  }
                  it.aboneNo = val(notes, "Hesap No");
                  String donem = val(notes, "Dönem");
                  Matcher dm = Pattern.compile("(\\d{1,2})[-./](\\d{4})").matcher(donem);
                  if (dm.find()) it.period = dm.group(2) + "-" + two(Integer.parseInt(dm.group(1)));
                  String pay = find("<cbc:PayableAmount[^>]*>([\\d.]+)</cbc:PayableAmount>", xml);
                  if (pay != null) it.amount = Double.parseDouble(pay);
                  String due = find("<cbc:PaymentDueDate>([\\d-]+)</cbc:PaymentDueDate>", xml);
                  if (due != null) it.dueDate = due;
