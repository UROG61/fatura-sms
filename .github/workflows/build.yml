          package com.altintas.faturasms;

          import java.util.Locale;
          import java.util.regex.Pattern;

          /** Hangi SMS'in fatura/borç bildirimi olduğuna karar verir. Android'e bağımlı değil. */
          public final class BillFilter {
              private BillFilter() {}

              // Bilinen kurum gönderen adları (normalize edilmiş, küçük harf, Türkçe karaktersiz)
              private static final Pattern SENDER = Pattern.compile(
                      "(\\bck\\b|ckbogazici|bogazici|ckenerji|enerjisa|iski|igdas|aksa|gaz|elektrik|edas|bedas|ayedas|"
                      + "toroslar|baskent|aski|izsu|buski|meski|koski|asat|suski|\\bsu\\b)");

              // Fatura/borç içeriği
              private static final Pattern CONTENT = Pattern.compile(
                      "(fatura|son odeme|borcunuz|borc bilgi|odenmemis|abone|tesisat|sozlesme hesab|\\bkwh\\b|\\bm3\\b|tuketim)");

              // Tutar
              private static final Pattern AMOUNT = Pattern.compile("(\\d[\\d.,]*\\s*(tl|try)\\b|tutar)");

              // Asla iletilmeyecek özel mesajlar (doğrulama kodları vb.)
              private static final Pattern PRIVATE = Pattern.compile(
                      "(sifre|dogrulama|onay kodu|tek kullanimlik|\\botp\\b|parola|guvenlik kodu|giris kodu|kodunuz)");

              // Fatura olmayan duyurular (kesinti, kampanya vb.)
              private static final Pattern NOISE = Pattern.compile(
                      "(su verilemeyecek|kesintisi|kesinti yapilacak|enerjilendirme|planli elektrik|sozlesme teklif|dijital faturaya gec|kagit tuketimini)");

              public static String norm(String s) {
                  if (s == null) return "";
                  StringBuilder b = new StringBuilder(s.length());
                  for (int i = 0; i < s.length(); i++) {
                      char c = s.charAt(i);
                      switch (c) {
                          case 'İ': case 'I': case 'ı': b.append('i'); break;
                          case 'Ş': case 'ş': b.append('s'); break;
                          case 'Ğ': case 'ğ': b.append('g'); break;
                          case 'Ü': case 'ü': b.append('u'); break;
                          case 'Ö': case 'ö': b.append('o'); break;
                          case 'Ç': case 'ç': b.append('c'); break;
                          case '³': b.append('3'); break;
                          case '̇': break; // birleşik nokta
                          default: b.append(Character.toLowerCase(c));
                      }
                  }
                  return b.toString().toLowerCase(Locale.ROOT);
              }

              public static boolean isBill(String from, String body) {
                  String f = norm(from), t = norm(body);
                  if (PRIVATE.matcher(t).find()) return false;
                  if (NOISE.matcher(t).find()) return false;
                  boolean content = CONTENT.matcher(t).find();
                  if (!content) return false;
                  boolean sender = SENDER.matcher(f).find() || SENDER.matcher(t).find();
                  boolean amount = AMOUNT.matcher(t).find();
                  return sender || (amount && t.contains("fatura"));
              }
          }
