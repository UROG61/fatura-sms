name: APK derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Proje dosyalarini olustur
        run: |
          mkdir -p 'app'
          cat > 'app/build.gradle' <<'FATURA_EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.altintas.faturasms'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.altintas.faturasms'
                  minSdk 26
                  targetSdk 34
                  versionCode(100 + (System.getenv('GITHUB_RUN_NUMBER') ?: '0').toInteger())
                  versionName "1." + (100 + (System.getenv('GITHUB_RUN_NUMBER') ?: '0').toInteger())
              }

              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword 'fatura-sms-imza'
                      keyAlias 'faturasms'
                      keyPassword 'fatura-sms-imza'
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
                  encoding 'UTF-8'
              }

              packaging {
                  resources {
                      pickFirsts += ['META-INF/LICENSE.md', 'META-INF/NOTICE.md', 'META-INF/LICENSE', 'META-INF/NOTICE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE.txt']
                  }
              }

              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
          }

          dependencies {
              implementation 'com.sun.mail:android-mail:1.6.7'
              implementation 'com.sun.mail:android-activation:1.6.7'
          }
          FATURA_EOF
          mkdir -p 'app/src/main'
          cat > 'app/src/main/AndroidManifest.xml' <<'FATURA_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.RECEIVE_SMS" />
              <uses-permission android:name="android.permission.READ_SMS" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <uses-feature android:name="android.hardware.telephony" android:required="false" />

              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Fatura Takip"
                  android:theme="@android:style/Theme.Material.Light.DarkActionBar">

                  <activity
                      android:name=".WebActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:theme="@android:style/Theme.Material.Light.NoActionBar">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <meta-data android:name="android.app.shortcuts" android:resource="@xml/shortcuts" />
                  </activity>

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="com.altintas.faturasms.SETTINGS" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".SmsReceiver"
                      android:exported="true"
                      android:permission="android.permission.BROADCAST_SMS">
                      <intent-filter android:priority="999">
                          <action android:name="android.provider.Telephony.SMS_RECEIVED" />
                      </intent-filter>
                  </receiver>
                  <receiver
                      android:name=".DigestReceiver"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                      </intent-filter>
                  </receiver>
                  <receiver
                      android:name=".InstallReceiver"
                      android:exported="false" />
              </application>
          </manifest>
          FATURA_EOF
          mkdir -p 'app/src/main/assets'
          cat > 'app/src/main/assets/index.html' <<'FATURA_EOF'
          <!DOCTYPE html>
          <html lang="tr">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
          <title>Fatura Takip</title>
          <style>
          :root{--bg:#f6f7f9;--card:#fff;--ink:#16181d;--mute:#6b7280;--line:#e5e7eb;--acc:#2563eb;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--el:#eab308;--su:#0ea5e9;--gaz:#f97316;--dg:#8b5cf6}
          @media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--ink:#eceef2;--mute:#9aa1ad;--line:#2a2e36;--acc:#60a5fa}}
          *{box-sizing:border-box}
          body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
          .wrap{max-width:720px;margin:0 auto;padding:14px 14px 90px}
          header{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
          h1{font-size:20px;margin:0}
          .save{font-size:12px;color:var(--mute)}
          .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
          .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
          .stat b{display:block;font-size:17px}
          .stat span{font-size:12px;color:var(--mute)}
          .stat.bad b{color:var(--bad)}.stat.warn b{color:var(--warn)}
          .tabs{display:flex;gap:6px;margin-bottom:12px;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:5}
          .tabs button{flex:1}
          button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 12px;cursor:pointer}
          button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
          button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
          button.sm{padding:6px 10px;font-size:13px}
          button.danger{color:var(--bad)}
          button:disabled{opacity:.5}
          .chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
          .chips button{white-space:nowrap;padding:6px 11px;font-size:13px;border-radius:99px}
          .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
          .bill{display:flex;gap:10px;align-items:flex-start}
          .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:19px;flex:none}
          .t-elektrik{background:color-mix(in srgb,var(--el) 20%,transparent)}
          .t-su{background:color-mix(in srgb,var(--su) 20%,transparent)}
          .t-dogalgaz{background:color-mix(in srgb,var(--gaz) 20%,transparent)}
          .t-diger{background:color-mix(in srgb,var(--dg) 20%,transparent)}
          .grow{flex:1;min-width:0}
          .row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
          .amt{font-weight:700;font-size:17px;white-space:nowrap}
          .sub{font-size:13px;color:var(--mute)}
          .badge{font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
          .b-paid{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
          .b-over{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
          .b-soon{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
          .b-open{background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc)}
          .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
          textarea,input,select{font:inherit;width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
          textarea{min-height:130px;resize:vertical}
          label{display:block;font-size:12px;color:var(--mute);margin:8px 0 3px}
          .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
          .muted{color:var(--mute);font-size:13px}
          .empty{text-align:center;color:var(--mute);padding:30px 10px}
          .err{color:var(--bad);font-size:13px;margin-top:6px}
          .note{font-size:13px;background:color-mix(in srgb,var(--acc) 8%,transparent);border-radius:10px;padding:10px;margin-top:10px}
          .sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
          .sheet .card{width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;margin:0;padding-bottom:24px}
          .bars{display:flex;align-items:flex-end;gap:8px;height:150px;margin-top:10px}
          .bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
          .stack{width:100%;display:flex;flex-direction:column-reverse;border-radius:6px 6px 0 0;overflow:hidden}
          .bar small{font-size:11px;color:var(--mute);margin-top:4px}
          .legend{display:flex;gap:12px;font-size:12px;color:var(--mute);margin-top:8px;flex-wrap:wrap}
          .dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px}
          table{width:100%;border-collapse:collapse;font-size:13px}
          td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
          th{color:var(--mute);font-weight:500}
          td.r,th.r{text-align:right}
          .spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px;margin-right:6px}
          @keyframes s{to{transform:rotate(360deg)}}

          :root{--teal:#2bb3cf;--teal2:#1b9fbd;--navy:#0b2a6b;--track:#e3e8f0;--pill-bad:#fbd5dd;--pill-ok:#d5f3e0}
          @media (prefers-color-scheme:dark){:root{--navy:#cfe0ff;--track:#2a3140;--pill-bad:#4a1f2a;--pill-ok:#173a26}}
          .hero{margin:-14px -14px 0;padding:18px 18px 46px;background:linear-gradient(135deg,#d9f2fb,#eef9fd 60%,#cdeef8);color:#1f2937}
          @media (prefers-color-scheme:dark){.hero{background:linear-gradient(135deg,#0f2a36,#132430);color:#e5e7eb}}
          .hero h2{margin:0;font-size:22px;font-weight:500}
          .hero .sub{color:inherit;opacity:.75}
          .hs{display:flex;align-items:flex-start;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 14px;gap:12px;margin:-30px -14px 0;padding:0 14px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
          .hs::-webkit-scrollbar{display:none}
          .hc{flex:0 0 100%;min-width:0;scroll-snap-align:start;background:var(--card);border-radius:24px;padding:16px;box-shadow:0 6px 24px rgba(15,40,80,.10);border:1px solid var(--line)}
          .hsel{position:relative;border:1px solid var(--line);border-radius:16px;padding:10px 40px 10px 14px;margin-bottom:14px}
          .hsel b{font-size:17px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
          .hsel select{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
          .hsel:after{content:"⌄";position:absolute;right:16px;top:50%;transform:translateY(-62%);font-size:22px;color:var(--mute)}
          .hgrid{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:start}
          .hamt{font-size:30px;font-weight:800;color:var(--navy);letter-spacing:-.5px;margin:4px 0 8px;white-space:nowrap}
          .pill{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px;padding:5px 14px;border-radius:99px}
          .pill.bad{background:var(--pill-bad);color:#d10f3a}.pill.ok{background:var(--pill-ok);color:var(--ok)}.pill.mid{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
          .chip2{background:var(--bg);border-radius:12px;padding:5px 10px;font-size:13px;font-weight:600;white-space:nowrap}
          .hr{text-align:right}.hr small{display:block;color:var(--mute);font-size:13px;margin-top:6px}.hr b{font-size:16px}
          .hlink{display:inline-flex;align-items:center;gap:6px;color:var(--teal2);font-weight:700;font-size:16px;text-decoration:none;margin-top:10px}
          .hbars{display:flex;gap:10px;overflow-x:auto;padding:22px 2px 4px;margin-top:6px;scrollbar-width:none}
          .hbars::-webkit-scrollbar{display:none}
          .hb{flex:0 0 52px;display:flex;flex-direction:column;align-items:center;cursor:pointer;position:relative}
          .hb .tr{width:30px;height:120px;background:var(--track);border-radius:99px;display:flex;align-items:flex-end;overflow:hidden}
          .hb .fl{width:100%;border-radius:99px;background:#a8dde8}
          .hb.sel .fl{background:var(--teal)}
          .hb.unp .fl{background:#d70f3a}
          .hb .ex{position:absolute;top:-20px;width:18px;height:18px;border-radius:50%;background:#e5333f;color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center}
          .hb .v{font-size:11px;color:var(--mute);margin-top:6px;white-space:nowrap}
          .hb.sel .v{color:var(--teal2);font-weight:700}
          .hb .m{font-size:13px;margin-top:2px}.hb .y{font-size:11px;color:var(--mute)}
          .bigbtn{display:block;width:100%;border:0;border-radius:18px;padding:15px;font-size:17px;font-weight:700;margin-top:14px;color:#fff;background:linear-gradient(90deg,#6fd0e3,var(--teal2));box-shadow:0 6px 16px rgba(27,159,189,.25)}
          .bigbtn.out{background:transparent;color:var(--teal2);border:2px solid var(--teal);box-shadow:none;margin-top:10px}
          .bigbtn.okb{background:linear-gradient(90deg,#5fd18b,#16a34a)}
          .dots{display:flex;justify-content:center;gap:6px;margin:10px 0 4px}
          .dots i{width:7px;height:7px;border-radius:99px;background:var(--line);transition:.2s}
          .dots i.on{width:20px;background:var(--teal)}
          .hsum{display:flex;gap:8px;margin:14px 0 4px}
          .hsum div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
          .hsum b{display:block;font-size:15px;white-space:nowrap}.hsum span{font-size:12px;color:var(--mute)}
          .bnav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:15;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
          .bnav div{display:flex;max-width:720px;width:100%}
          .bnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mute);padding:4px 0}
          .bnav button span{font-size:20px;width:40px;height:32px;display:grid;place-items:center;border-radius:99px}
          .bnav button.on{color:var(--teal2);font-weight:700}
          .bnav button.on span{background:var(--teal);color:#fff}

          .hero .row{align-items:center}.hero a{text-decoration:none}
          body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
          .wrap{padding-bottom:100px}
          .syncbtn{border:0;background:rgba(255,255,255,.75);color:#0e7490;font-weight:700;font-size:15px;padding:10px 16px;border-radius:99px;box-shadow:0 2px 8px rgba(0,0,0,.08)}.syncbtn:disabled{opacity:1;color:#64748b}
          </style>
          </head>
          <body>
          <div id="root"></div>
          <script>"use strict";
          var A=window.Android||null;
          var D={bills:[],notices:[],subState:{},names:{}};
          var ui={tab:"home",homeIdx:0,homeSel:{},filter:"open",openSub:null,showPasif:false,syncing:false,msg:""};
          var AY=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
          var TYPES={elektrik:{n:"Elektrik",i:"⚡",u:"kWh"},su:{n:"Su",i:"💧",u:"m³"},dogalgaz:{n:"Doğalgaz",i:"🔥",u:"m³"},diger:{n:"Diğer",i:"📄",u:""}};
          function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
          function tl(n){return Number(n||0).toLocaleString("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2})+" ₺"}
          function fmtN(n,d){return Number(n).toLocaleString("tr-TR",{minimumFractionDigits:d===1?0:d,maximumFractionDigits:d})}
          function todayISO(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
          function ago(n){var d=new Date();d.setDate(d.getDate()-n);return d.toISOString().slice(0,10)}
          function days(iso){if(!iso)return null;return Math.round((new Date(iso+"T00:00:00")-new Date(todayISO()+"T00:00:00"))/864e5)}
          function trDate(iso){if(!iso)return"—";var p=iso.split("-");return p[2]+"."+p[1]+"."+p[0]}
          function trPeriod(p){return p?AY[+p.slice(5)-1]+" "+p.slice(0,4):""}
          function status(b){if(b.paid)return"paid";var d=days(b.dueDate);if(d==null)return"open";if(d<0)return"over";if(d<=7)return"soon";return"open"}
          function badge(b){var s=status(b),d=days(b.dueDate);if(b.noPay)return'<span class="badge b-paid">Ödeme gerekmez</span>';if(s==="paid")return'<span class="badge b-paid">Ödendi'+(b.assumed?" (varsayım)":"")+"</span>";if(s==="over")return'<span class="badge b-over">'+(-d)+" gün gecikti</span>";if(s==="soon")return'<span class="badge b-soon">'+(d===0?"Bugün son gün":d+" gün kaldı")+"</span>";return'<span class="badge b-open">Son ödeme '+trDate(b.dueDate)+"</span>"}
          function subKey(b){return b.aboneNo?"a:"+b.aboneNo:"p:"+(b.provider||"")}
          function nameOf(k,f){return(D.names||{})[k]||((f.provider||"Fatura")+(f.aboneNo?" · "+String(f.aboneNo).slice(-4):""))}

          function load(){try{D=JSON.parse(A?A.data():"{}")}catch(e){D={}}D.bills=D.bills||[];D.notices=D.notices||[];D.subState=D.subState||{};D.names=D.names||{}}
          window.reload=function(){load();render()};
          window.syncState=function(on,msg){ui.syncing=on;if(msg!=null)ui.msg=msg;paintSync();if(on)poll()};
          function paintSync(){var el=document.getElementById("sync");if(el)el.innerHTML=syncHtml();var l=document.getElementById("lastsync");if(l)l.innerHTML=lastHtml()}
          var pollT=null;function poll(){if(pollT||!A||!A.status)return;pollT=setInterval(function(){var st={};try{st=JSON.parse(A.status())}catch(e){}if(!st.running){clearInterval(pollT);pollT=null;ui.syncing=false;ui.msg=st.msg||"";load();render()}},1500)}
          function lastHtml(){var st={};try{st=JSON.parse(A&&A.status?A.status():"{}")}catch(e){}if(!st.at)return"";var d=new Date(st.at);return"Son yenileme "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+(st.msg?" · "+esc(st.msg):"")}
          window.back=function(){if(ui.tab!=="home"){ui.tab="home";render();return true}return false};
          function syncHtml(){return'<button class="syncbtn" data-a="sync"'+(ui.syncing?' disabled':'')+'>'+(ui.syncing?'<span class="spin"></span>Yenileniyor…':'↻ Yenile')+'</button>'}

          function subs(){
            var G={};D.bills.forEach(function(b){var k=subKey(b);(G[k]=G[k]||[]).push(b)});
            D.notices.forEach(function(n){if(n.kind==="borc"&&n.aboneNo&&!G["a:"+n.aboneNo])G["a:"+n.aboneNo]=[]});
            return Object.keys(G).map(function(k){
              var L=G[k].slice().sort(function(a,b){return((b.period||"")+(b.dueDate||"")).localeCompare((a.period||"")+(a.dueDate||""))});
              var real=L.filter(function(b){return!b.noPay});var no=k.indexOf("a:")===0?k.slice(2):"";
              var nts=D.notices.filter(function(n){return no&&n.aboneNo===no}).sort(function(a,b){return(b.date||"").localeCompare(a.date||"")});
              var f=real[0]||L[0]||{type:(nts[0]||{}).type||"diger",provider:(nts[0]||{}).provider||"",aboneNo:no};
              var open=real.filter(function(b){return!b.paid});
              var act="",added="";L.forEach(function(b){[b.dueDate,b.period?b.period+"-15":""].forEach(function(d){if(d&&d>act)act=d});if(b.srcDate&&b.srcDate>added)added=b.srcDate});
              nts.forEach(function(n){if(n.date>act)act=n.date;if(n.date>added)added=n.date});
              var x={key:k,no:no,bills:L,real:real,last:real[0]||null,first:f,notices:nts,open:open,act:act,added:added,
                debt:open.reduce(function(s,b){return s+b.amount},0),overdue:open.some(function(b){return status(b)==="over"})};
              x.name=nameOf(k,f);x.pasif=isPasif(x);return x;
            }).sort(function(a,b){return(b.overdue-a.overdue)||(b.debt-a.debt)||a.name.localeCompare(b.name)});
          }
          function isPasif(x){var o=D.subState[x.key];if(o&&o.s==="pasif")return!(x.added&&o.at&&x.added>o.at);if(x.open.length)return false;var m=x.act||"";if(o&&o.s==="aktif"&&o.at>m)m=o.at;return!m||m<ago(90)}

          /* ---------- ana sayfa ---------- */
          function homeView(){
            var S=subs().filter(function(x){return!x.pasif});
            S.sort(function(a,b){return(b.open.length>0)-(a.open.length>0)||(b.debt-a.debt)});
