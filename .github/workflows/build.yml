                  String today = BillStore.today();
                  int hour = java.util.Calendar.getInstance().get(java.util.Calendar.HOUR_OF_DAY);
                  if (!force && (today.equals(sp.getString("dueNotified", "")) || hour < 9)) return;
                  JSONObject o = new BillStore(c).load();
