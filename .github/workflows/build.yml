          package com.altintas.faturasms;

          import android.content.ContentResolver;
          import android.content.Context;
          import android.database.Cursor;
          import android.net.Uri;
          import android.provider.Telephony;

          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Calendar;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.Date;
          import java.util.List;
          import java.util.Locale;

          /**
           * Fatura SMS'lerini biriktirir ve seçilen günde tek bir özet maili olarak Gmail'e gönderir.
           * Ağ işlemi yaptığı için ana iş parçacığında çağrılmamalı.
           */
          public final class Forwarder {
              private Forwarder() {}

              public static final String HOST = "smtp.gmail.com";
              public static final int PORT = 465;
              private static final int MAX_PER_MAIL = 40;

              public static class Result {
                  public int found, added, sent, mails;
                  public String error;
              }

              /** Fatura SMS'lerini özet kuyruğuna ekler. Mail göndermez. */
              public static synchronized Result collect(Context ctx, List<Sms> incoming) {
                  Store st = new Store(ctx);
                  Result r = new Result();
                  List<Sms> q = st.queue();
                  List<String> keys = new ArrayList<>();
                  for (Sms s : q) keys.add(s.key());
                  for (Sms s : incoming) {
                      if (!BillFilter.isBill(s.from, s.body)) continue;
                      r.found++;
                      String k = s.key();
                      if (keys.contains(k) || st.isSent(k)) continue;
                      keys.add(k);
                      q.add(s);
                      r.added++;
                  }
                  // Daha önce biriken kesinti/kampanya SMS'lerini de temizle
                  List<Sms> clean = new ArrayList<>();
                  for (Sms s : q) if (BillFilter.isBill(s.from, s.body)) clean.add(s);
                  st.setQueue(clean);
                  if (r.added > 0) st.log("Özete eklendi: " + r.added + " SMS (bekleyen " + clean.size() + ")");
                  return r;
              }

              /** Bir sonraki özet zamanı (ms). Kapalıysa 0. */
              public static long nextDigest(Store st) {
                  int mode = st.digestMode();
                  if (mode == 3) return 0;
                  Calendar c = Calendar.getInstance();
                  c.setTimeInMillis(st.lastDigest());
                  c.set(Calendar.HOUR_OF_DAY, 9); c.set(Calendar.MINUTE, 0); c.set(Calendar.SECOND, 0); c.set(Calendar.MILLISECOND, 0);
                  long last = st.lastDigest();
                  for (int i = 0; i < 400; i++) {
                      if (c.getTimeInMillis() > last) {
                          int dow = c.get(Calendar.DAY_OF_WEEK), dom = c.get(Calendar.DAY_OF_MONTH);
                          if (mode == 0 && dow == Calendar.MONDAY) break;
                          if (mode == 1 && (dom == 1 || dom == 15)) break;
                          if (mode == 2 && dom == 15) break;
                      }
                      c.add(Calendar.DAY_OF_MONTH, 1);
                  }
                  return c.getTimeInMillis();
              }

              /** Zamanı geldiyse (ya da force ise) biriken SMS'leri tek mail olarak gönderir. */
              public static synchronized Result sendDigest(Context ctx, boolean force) {
                  Store st = new Store(ctx);
                  Result r = new Result();
                  List<Sms> q = st.queue();
                  r.found = q.size();
                  if (!force) {
                      long next = nextDigest(st);
                      if (next == 0 || System.currentTimeMillis() < next) return r;
                  }
                  if (q.isEmpty()) {
                      if (!force) st.setLastDigest(System.currentTimeMillis());
                      return r;
                  }
                  if (!st.configured()) { r.error = "Gmail adresi ve uygulama şifresi girilmemiş"; return r; }
                  Collections.sort(q, new Comparator<Sms>() { public int compare(Sms a, Sms b) { return Long.compare(a.date, b.date); } });
                  List<Sms> left = new ArrayList<>(q);
                  try {
                      while (!left.isEmpty()) {
                          List<Sms> part = new ArrayList<>(left.subList(0, Math.min(MAX_PER_MAIL, left.size())));
                          Smtp.send(HOST, PORT, true, st.email(), st.pass(), st.email(), digestSubject(part), digestBody(part));
                          for (Sms s : part) st.markSent(s.key());
                          left.removeAll(part);
                          st.setQueue(left);
                          r.sent += part.size(); r.mails++;
                      }
                      st.setLastDigest(System.currentTimeMillis());
                      st.log("Özet maili gönderildi: " + r.sent + " SMS");
                  } catch (Smtp.SmtpException e) {
                      r.error = e.code == 535 || e.code == 534
                              ? "Gmail şifreyi kabul etmedi. 16 haneli uygulama şifresi gerekli."
                              : "Gmail hatası (" + e.code + ")";
                      st.log("Hata: " + r.error);
                  } catch (Exception e) {
                      r.error = "İnternet yok veya Gmail'e ulaşılamadı";
                      st.log("Hata: " + r.error + " — sonraki kontrolde tekrar denenecek");
                  }
                  return r;
              }

              /** Gelen kutusundaki son N günün SMS'leri. */
              public static List<Sms> readInbox(Context ctx, int days) {
                  List<Sms> out = new ArrayList<>();
                  long since = System.currentTimeMillis() - days * 86400000L;
                  ContentResolver cr = ctx.getContentResolver();
                  Uri uri = Telephony.Sms.Inbox.CONTENT_URI;
                  String[] proj = {Telephony.Sms.ADDRESS, Telephony.Sms.BODY, Telephony.Sms.DATE};
                  Cursor c = null;
                  try {
                      c = cr.query(uri, proj, Telephony.Sms.DATE + " > ?", new String[]{String.valueOf(since)}, Telephony.Sms.DATE + " ASC");
                      if (c != null) {
                          while (c.moveToNext()) out.add(new Sms(c.getString(0), c.getString(1), c.getLong(2)));
                      }
                  } finally {
                      if (c != null) c.close();
                  }
                  return out;
              }

              static String fmt(long t) { return new SimpleDateFormat("dd.MM.yyyy HH:mm", new Locale("tr")).format(new Date(t)); }
              static String day(long t) { return new SimpleDateFormat("dd.MM.yyyy", new Locale("tr")).format(new Date(t)); }

              public static String digestSubject(List<Sms> l) {
                  return "Fatura SMS Özeti - " + day(System.currentTimeMillis()) + " (" + l.size() + " SMS)";
              }

              public static String digestBody(List<Sms> l) {
                  StringBuilder b = new StringBuilder();
                  b.append("Telefondaki fatura SMS'lerinin özeti (Fatura SMS uygulaması). Toplam ").append(l.size()).append(" SMS.\n\n");
                  int i = 0;
                  for (Sms s : l) {
                      i++;
                      b.append("===== SMS ").append(i).append("/").append(l.size()).append(" =====\n");
                      b.append("Gönderen: ").append(s.from).append("\n");
                      b.append("SMS tarihi: ").append(fmt(s.date)).append("\n\n");
                      b.append(s.body.trim()).append("\n\n");
                  }
                  return b.toString();
              }
          }
