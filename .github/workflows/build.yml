          /** Birkaç saatte bir uyanır: SMS + Gmail'i yeniler, son ödeme hatırlatmasını yapar. Telefon açılınca alarmı yeniden kurar. */
          public class DigestReceiver extends BroadcastReceiver {
              public static void arm(Context ctx) {
                  AlarmManager am = (AlarmManager) ctx.getSystemService(Context.ALARM_SERVICE);
                  if (am == null) return;
                  Intent i = new Intent(ctx, DigestReceiver.class).setAction("com.altintas.faturasms.TICK");
                  PendingIntent pi = PendingIntent.getBroadcast(ctx, 7, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  am.setInexactRepeating(AlarmManager.RTC_WAKEUP, System.currentTimeMillis() + 20 * 60000L,
                          AlarmManager.INTERVAL_HOUR * 3, pi);
              }

              @Override
              public void onReceive(final Context context, Intent intent) {
                  String a = intent.getAction();
                  if (Intent.ACTION_BOOT_COMPLETED.equals(a) || Intent.ACTION_MY_PACKAGE_REPLACED.equals(a)) {
                      arm(context);
                      return;
                  }
                  final PendingResult pr = goAsync();
                  new Thread(new Runnable() {
                      public void run() {
                          try {
                              Sync.Result r = Sync.all(context);
                              if (!r.added.isEmpty()) Notifier.newBills(context, new BillStore(context).load(), r.added);
                              Notifier.dueCheck(context, false);
                          } catch (Throwable ignored) {
                          } finally { pr.finish(); }
                      }
                  }).start();
              }
          }
