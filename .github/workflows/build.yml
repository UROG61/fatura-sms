              }
              public boolean configured() { return !email().isEmpty() && !pass().isEmpty(); }

              public synchronized boolean isSent(String key) { return sp.getStringSet("sent", new HashSet<String>()).contains(key); }
              public synchronized void markSent(String key) {
                  Set<String> s = new HashSet<>(sp.getStringSet("sent", new HashSet<String>()));
                  s.add(key);
                  sp.edit().putStringSet("sent", s).apply();
              }
              public synchronized int sentCount() { return sp.getStringSet("sent", new HashSet<String>()).size(); }

              /* ---- bekleyen (gönderilemeyen) SMS kuyruğu ---- */
              public synchronized List<Sms> queue() {
                  List<Sms> out = new ArrayList<>();
                  try {
                      JSONArray a = new JSONArray(sp.getString("queue", "[]"));
                      for (int i = 0; i < a.length(); i++) {
                          JSONObject o = a.getJSONObject(i);
                          out.add(new Sms(o.getString("from"), o.getString("body"), o.getLong("date")));
                      }
                  } catch (Exception ignored) {}
                  return out;
              }
              public synchronized void setQueue(List<Sms> q) {
                  JSONArray a = new JSONArray();
                  try {
                      for (Sms s : q) {
                          JSONObject o = new JSONObject();
                          o.put("from", s.from); o.put("body", s.body); o.put("date", s.date);
                          a.put(o);
                      }
                  } catch (Exception ignored) {}
                  sp.edit().putString("queue", a.toString()).apply();
              }

              /* ---- özet maili ayarı ---- */
              /** 0 = haftalık (Pazartesi), 1 = ayda 2 (1'i ve 15'i), 2 = ayda 1 (15'i), 3 = kapalı (sadece elle) */
              public int digestMode() { return sp.getInt("digestMode", 0); }
              public void setDigestMode(int m) { sp.edit().putInt("digestMode", m).apply(); }
              public long lastDigest() {
                  long v = sp.getLong("lastDigest", 0);
                  if (v == 0) { v = System.currentTimeMillis(); sp.edit().putLong("lastDigest", v).apply(); }
                  return v;
              }
              public void setLastDigest(long t) { sp.edit().putLong("lastDigest", t).apply(); }

              /* ---- günlük ---- */
              public synchronized void log(String line) {
                  try {
                      JSONArray a = new JSONArray(sp.getString("log", "[]"));
                      JSONArray b = new JSONArray();
                      String ts = new SimpleDateFormat("dd.MM HH:mm", new Locale("tr")).format(new Date());
                      b.put(ts + "  " + line);
                      for (int i = 0; i < a.length() && i < 60; i++) b.put(a.getString(i));
                      sp.edit().putString("log", b.toString()).apply();
                  } catch (Exception ignored) {}
              }
              public synchronized String logText() {
                  StringBuilder sb = new StringBuilder();
                  try {
                      JSONArray a = new JSONArray(sp.getString("log", "[]"));
                      for (int i = 0; i < a.length(); i++) sb.append(a.getString(i)).append('\n');
                  } catch (Exception ignored) {}
                  return sb.toString();
              }
          }
