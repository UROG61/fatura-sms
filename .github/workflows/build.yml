          public final class Updater {
              private Updater() {}

              public static final String REPO = "UROG61/fatura-sms";
              private static final String API = "https://api.github.com/repos/" + REPO + "/releases/tags/latest";

              public static class Release {
                  public long versionCode;
                  public String apkUrl;
                  public String notes;
              }

              public static long installedVersion(Context c) {
                  try {
                      PackageInfo pi = c.getPackageManager().getPackageInfo(c.getPackageName(), 0);
                      return Build.VERSION.SDK_INT >= 28 ? pi.getLongVersionCode() : pi.versionCode;
                  } catch (Exception e) {
                      return 0;
                  }
              }

              public static String installedName(Context c) {
                  try {
                      return c.getPackageManager().getPackageInfo(c.getPackageName(), 0).versionName;
                  } catch (Exception e) {
                      return "?";
                  }
              }

              /** Son sürüm bilgisini getirir; bulunamazsa null. */
              public static Release latest() throws IOException {
                  HttpURLConnection con = open(API, "application/vnd.github+json");
                  int code = con.getResponseCode();
                  if (code == 404) return null;
                  if (code != 200) throw new IOException("GitHub yanıtı: " + code);
                  String body = new String(readAll(con.getInputStream()), "UTF-8");
                  con.disconnect();
