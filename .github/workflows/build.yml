          package com.altintas.faturasms;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import org.json.JSONObject;

          /** Ana ekran: kartlı fatura görünümü (assets/index.html), veriler telefondaki kayıttan gelir. */
          public class WebActivity extends Activity {
              private WebView web;
              static volatile boolean running;
              static volatile long startedAt;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  Store st = new Store(this);
                  DigestReceiver.arm(this);
                  if (!hasSms() || !st.configured()) {
                      // İlk kurulum: önce ayarlar
                      startActivity(new Intent(this, MainActivity.class).putExtra("settings", true).putExtra("first", true));
                  }
                  getWindow().setStatusBarColor(Color.parseColor("#D9F2FB"));
                  getWindow().getDecorView().setSystemUiVisibility(android.view.View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR);
                  web = new WebView(this);
                  WebSettings ws = web.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);
                  ws.setAllowFileAccess(false);
                  web.setWebChromeClient(new WebChromeClient());
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, android.webkit.WebResourceRequest req) {
                          openUrl(req.getUrl().toString());
                          return true;
                      }
                  });
                  web.addJavascriptInterface(new Bridge(), "Android");
                  web.loadUrl("file:///android_asset/index.html");
                  setContentView(web);
                  if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED)
                      requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 5);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (web != null) web.evaluateJavascript("window.reload&&reload()", null);
                  // Açılışta arka planda yenile (SMS + Gmail)
                  if (hasSms()) startSync(false);
              }

              @Override
              public void onBackPressed() {
                  if (web != null) {
                      web.evaluateJavascript("window.back?back():false", v -> { if (!"true".equals(v)) WebActivity.super.onBackPressed(); });
                  } else super.onBackPressed();
              }

              private boolean hasSms() {
                  return checkSelfPermission(Manifest.permission.READ_SMS) == PackageManager.PERMISSION_GRANTED;
              }

              private void openUrl(String u) {
                  try { startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(u))); } catch (Exception ignored) {}
              }

              private void js(final String code) {
                  runOnUiThread(() -> { if (web != null) web.evaluateJavascript(code, null); });
              }

              private synchronized void startSync(final boolean manual) {
                  // Takılı kalmış eski bir yenileme 4 dakikadan uzun sürdüyse yok say
                  if (running && System.currentTimeMillis() - startedAt < 240000) {
                      if (manual) js("window.syncState&&syncState(true,'Zaten yenileniyor…')");
                      return;
                  }
                  running = true;
                  startedAt = System.currentTimeMillis();
                  js("window.syncState&&syncState(true)");
                  new Thread(() -> {
                      String msg;
                      try {
                          Sync.Result r = Sync.all(WebActivity.this);
                          msg = r.error != null ? r.error : (r.newBills > 0 ? r.newBills + " yeni fatura eklendi" : (manual ? "Yeni fatura yok" : ""));
                          if (!r.added.isEmpty()) Notifier.newBills(WebActivity.this, new BillStore(WebActivity.this).load(), r.added);
                          Notifier.dueCheck(WebActivity.this, false);
                      } catch (Throwable t) {
                          msg = "Yenilenemedi";
                      }
                      running = false;
                      getSharedPreferences("faturasms", MODE_PRIVATE).edit()
                              .putLong("lastSyncAt", System.currentTimeMillis()).putString("lastSyncMsg", msg).apply();
                      js("window.syncState&&syncState(false," + JSONObject.quote(msg) + ");window.reload&&reload()");
                  }).start();
              }

              /** Sayfadaki JavaScript'in çağırdığı köprü. */
              public class Bridge {
                  @JavascriptInterface public String data() { return new BillStore(WebActivity.this).load().toString(); }
                  @JavascriptInterface public void setPaid(String id, boolean paid) { new BillStore(WebActivity.this).setPaid(id, paid); }
                  @JavascriptInterface public void rename(String key, String name) { new BillStore(WebActivity.this).rename(key, name); }
                  @JavascriptInterface public void setSub(String key, String state) { new BillStore(WebActivity.this).setSub(key, state); }
                  @JavascriptInterface public void deleteBill(String id) { new BillStore(WebActivity.this).deleteBill(id); }
                  @JavascriptInterface public void sync() { startSync(true); }
                  @JavascriptInterface public void open(String url) { openUrl(url); }
                  @JavascriptInterface public void settings() {
                      startActivity(new Intent(WebActivity.this, MainActivity.class).putExtra("settings", true));
                  }
                  @JavascriptInterface public String status() {
                      android.content.SharedPreferences sp = getSharedPreferences("faturasms", MODE_PRIVATE);
                      try {
                          JSONObject o = new JSONObject();
                          o.put("running", running);
                          o.put("at", sp.getLong("lastSyncAt", 0));
                          o.put("msg", sp.getString("lastSyncMsg", ""));
                          return o.toString();
                      } catch (Exception e) { return "{}"; }
                  }
                  @JavascriptInterface public String version() { return Updater.installedName(WebActivity.this); }
              }
          }
