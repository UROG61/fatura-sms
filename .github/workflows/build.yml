          package com.altintas.faturasms;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.provider.Telephony;
          import android.telephony.SmsMessage;

          import java.util.ArrayList;
          import java.util.LinkedHashMap;
          import java.util.List;
          import java.util.Map;

          /** Yeni gelen SMS'leri yakalar, fatura ise özet kuyruğuna ekler. */
          public class SmsReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(final Context context, Intent intent) {
                  if (!Telephony.Sms.Intents.SMS_RECEIVED_ACTION.equals(intent.getAction())) return;
                  SmsMessage[] parts;
                  try {
                      parts = Telephony.Sms.Intents.getMessagesFromIntent(intent);
                  } catch (Exception e) {
                      return;
                  }
                  if (parts == null || parts.length == 0) return;

                  // Çok parçalı SMS'leri birleştir
                  Map<String, StringBuilder> bodies = new LinkedHashMap<>();
                  Map<String, Long> dates = new LinkedHashMap<>();
                  for (SmsMessage m : parts) {
                      if (m == null) continue;
                      String from = m.getDisplayOriginatingAddress();
                      if (from == null) from = "";
                      StringBuilder sb = bodies.get(from);
                      if (sb == null) { sb = new StringBuilder(); bodies.put(from, sb); dates.put(from, m.getTimestampMillis()); }
                      String b = m.getDisplayMessageBody();
                      if (b != null) sb.append(b);
                  }
                  final List<Sms> list = new ArrayList<>();
                  for (Map.Entry<String, StringBuilder> e : bodies.entrySet()) {
                      Long d = dates.get(e.getKey());
                      list.add(new Sms(e.getKey(), e.getValue().toString(), d == null ? System.currentTimeMillis() : d));
                  }

                  final PendingResult pr = goAsync();
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              Forwarder.collect(context, list);
                              Forwarder.sendDigest(context, false);
                          } catch (Throwable ignored) {
                          } finally {
                              pr.finish();
                          }
                      }
                  }).start();
              }
          }
