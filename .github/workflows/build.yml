          package com.altintas.faturasms;

          import android.content.Context;

          import org.json.JSONObject;

          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.Date;
          import java.util.List;
          import java.util.Properties;
          import java.util.zip.ZipEntry;
          import java.util.zip.ZipInputStream;

          import javax.mail.Address;
          import javax.mail.BodyPart;
          import javax.mail.FetchProfile;
          import javax.mail.Folder;
          import javax.mail.Message;
          import javax.mail.Multipart;
          import javax.mail.Part;
          import javax.mail.Session;
          import javax.mail.Store;
          import javax.mail.internet.InternetAddress;
          import javax.mail.search.AndTerm;
          import javax.mail.search.ComparisonTerm;
          import javax.mail.search.FromStringTerm;
          import javax.mail.search.OrTerm;
          import javax.mail.search.ReceivedDateTerm;
          import javax.mail.search.SearchTerm;
          import javax.mail.search.SubjectTerm;

          /** Telefondaki SMS'leri ve Gmail'deki fatura maillerini okuyup yerel kayda ekler. Ana iş parçacığında çağrılmamalı. */
          public final class Sync {
              private Sync() {}

              public static class Result {
                  public int newBills, sms, mails;
                  public String error;
                  public List<JSONObject> added = new ArrayList<>();
              }

              private static final Object RUN = new Object();

              /** SMS + Gmail. */
              public static Result all(Context ctx) {
                  synchronized (RUN) {
                      Result r = new Result();
                      BillStore bs = new BillStore(ctx);
                      JSONObject o = bs.load();
                      try { sms(ctx, o, r); } catch (Exception e) { r.error = "SMS okunamadı"; }
                      bs.save(o);
                      try { mail(ctx, o, r); } catch (Exception e) { r.error = mailError(e); new com.altintas.faturasms.Store(ctx).log("Gmail: " + r.error); }
                      bs.save(o);
                      new com.altintas.faturasms.Store(ctx).log("Yenilendi: " + r.newBills + " yeni fatura (" + r.sms + " SMS, " + r.mails + " mail tarandı)"
                              + (r.error != null ? " · " + r.error : ""));
                      return r;
                  }
              }

              static String mailError(Exception e) {
                  String m = String.valueOf(e.getMessage());
                  if (e instanceof javax.mail.AuthenticationFailedException || m.contains("AUTHENTICATIONFAILED") || m.contains("Invalid credentials"))
                      return "Gmail şifreyi kabul etmedi (16 haneli uygulama şifresi gerekli)";
                  if (e instanceof java.net.UnknownHostException || m.contains("UnknownHost") || m.contains("connect"))
                      return "İnternet yok, Gmail'e ulaşılamadı";
                  return "Gmail okunamadı: " + m;
              }

              /* ---------------- SMS ---------------- */

              static void sms(Context ctx, JSONObject o, Result r) {
                  long since = o.optLong("smsSince", 0);
                  int days = since == 0 ? 200 : (int) Math.max(1, (System.currentTimeMillis() - since) / 86400000L + 2);
                  List<Sms> list = Forwarder.readInbox(ctx, days);
                  for (Sms s : list) {
                      String key = "s:" + s.key();
                      if (BillStore.seen(o, key)) continue;
                      BillStore.markSeen(o, key);
                      r.sms++;
                      JSONObject b = BillStore.add(o, Parser.sms(s.from, s.body), key, s.date, "sms");
                      if (b != null) { r.newBills++; r.added.add(b); }
                  }
                  try { o.put("smsSince", System.currentTimeMillis()); } catch (Exception ignored) {}
              }

              /** Yeni gelen tek bir SMS (SmsReceiver). Yeni fatura eklendiyse onu döndürür. */
              public static JSONObject oneSms(Context ctx, Sms s) {
                  synchronized (RUN) {
                      BillStore bs = new BillStore(ctx);
                      JSONObject o = bs.load();
                      String key = "s:" + s.key();
                      if (BillStore.seen(o, key)) return null;
                      BillStore.markSeen(o, key);
                      JSONObject b = BillStore.add(o, Parser.sms(s.from, s.body), key, s.date, "sms");
                      bs.save(o);
                      return b;
                  }
              }

              /* ---------------- Gmail (IMAP) ---------------- */

              static final String[] SENDERS = {"ckbogazici", "ckenerji", "igdas", "aksa", "iski", "tiski", "enerjisa", "turkcell",
                      "turktelekom", "bedas", "qnbesolutions"};

              static void mail(Context ctx, JSONObject o, Result r) throws Exception {
                  com.altintas.faturasms.Store st = new com.altintas.faturasms.Store(ctx);
                  if (!st.configured()) return;
                  Properties p = new Properties();
                  p.put("mail.store.protocol", "imaps");
                  p.put("mail.imaps.host", "imap.gmail.com");
                  p.put("mail.imaps.port", "993");
                  p.put("mail.imaps.ssl.enable", "true");
                  p.put("mail.imaps.connectiontimeout", "20000");
                  p.put("mail.imaps.timeout", "40000");
                  Session session = Session.getInstance(p);
                  Store store = session.getStore("imaps");
                  store.connect("imap.gmail.com", st.email(), st.pass());
                  try {
                      Folder f = allMail(store);
                      f.open(Folder.READ_ONLY);
                      long since = o.optLong("mailSince", 0);
                      Date from = new Date(since == 0 ? System.currentTimeMillis() - 200L * 86400000L : since - 3L * 86400000L);
                      List<SearchTerm> ors = new ArrayList<>();
                      for (String s : SENDERS) ors.add(new FromStringTerm(s));
                      ors.add(new SubjectTerm("Fatura"));
                      ors.add(new SubjectTerm("Bilgilendirme"));
                      FetchProfile fp = new FetchProfile();
                      fp.add(FetchProfile.Item.ENVELOPE);
                      fp.add("Message-ID");
                      Message[] msgs;
                      boolean filterLocal = false;
                      try {
                          msgs = f.search(new AndTerm(new ReceivedDateTerm(ComparisonTerm.GE, from), new OrTerm(ors.toArray(new SearchTerm[0]))));
                      } catch (Exception se) {
                          // Sunucu karmaşık aramayı kabul etmezse: tarihe göre al, burada süz
                          msgs = f.search(new ReceivedDateTerm(ComparisonTerm.GE, new Date(Math.max(from.getTime(), System.currentTimeMillis() - 60L * 86400000L))));
                          filterLocal = true;
                      }
                      // Çok fazla mail varsa en yeni 400 tanesine bak (ilk tarama takılmasın)
                      if (msgs.length > 400) msgs = java.util.Arrays.copyOfRange(msgs, msgs.length - 400, msgs.length);
                      f.fetch(msgs, fp);
                      for (Message m : msgs) {
                          if (filterLocal && !wanted(m)) continue;
                          String mid = header(m, "Message-ID");
                          Date rd = m.getReceivedDate() != null ? m.getReceivedDate() : m.getSentDate();
                          long date = rd == null ? System.currentTimeMillis() : rd.getTime();
                          String key = "m:" + (mid != null ? mid : (m.getSubject() + date));
                          if (BillStore.seen(o, key)) continue;
                          BillStore.markSeen(o, key);
                          r.mails++;
                          try { handle(o, m, key, date, r); } catch (Exception ignored) {}
                      }
                      f.close(false);
                      o.put("mailSince", System.currentTimeMillis());
                  } finally {
                      try { store.close(); } catch (Exception ignored) {}
                  }
              }

              /** Gmail'in "Tüm Postalar" klasörü (dile göre adı değişir; \All özelliğinden bulunur). */
              static Folder allMail(Store store) throws Exception {
                  try {
                      for (Folder f : store.getDefaultFolder().list("*")) {
                          if (f instanceof com.sun.mail.imap.IMAPFolder) {
                              for (String a : ((com.sun.mail.imap.IMAPFolder) f).getAttributes()) if ("\\All".equalsIgnoreCase(a)) return f;
                          }
                      }
                  } catch (Exception ignored) {}
                  return store.getFolder("INBOX");
              }

              static String header(Message m, String h) {
                  try { String[] v = m.getHeader(h); return v != null && v.length > 0 ? v[0] : null; } catch (Exception e) { return null; }
              }

              static void handle(JSONObject o, Message m, String key, long date, Result r) throws Exception {
                  String subject = m.getSubject() == null ? "" : m.getSubject();
                  String from = "";
                  Address[] fa = m.getFrom();
                  if (fa != null && fa.length > 0) from = fa[0] instanceof InternetAddress ? ((InternetAddress) fa[0]).getAddress() : fa[0].toString();
                  Body body = new Body();
                  collect(m, body);
                  String text = body.plain.length() > 0 ? body.plain.toString() : stripHtml(body.html.toString());

                  // Eski uygulamanın ilettiği SMS'ler (tekil ya da özet)
                  if (subject.startsWith("Fatura SMS")) {
                      if (text.contains("===== SMS")) {
                          int k = 0;
                          for (String[] s : Parser.splitDigest(text)) {
                              JSONObject b = BillStore.add(o, Parser.sms(s[0], s[1]), key + "#" + (k++), date, "sms");
                              if (b != null) { r.newBills++; r.added.add(b); }
                          }
                      } else {
                          String sf = Parser.find("G[öo]nderen:\\s*(.+)", text);
                          String sb = text.replaceFirst("(?s).*?SMS tarihi:[^\\n]*\\n", "").trim();
                          JSONObject b = BillStore.add(o, Parser.sms(sf == null ? "" : sf.trim(), sb), key, date, "sms");
                          if (b != null) { r.newBills++; r.added.add(b); }
                      }
                      return;
                  }
                  // CK e-fatura: UBL ekinden ayrıntılı bilgi
                  Parser.Item it = null;
                  for (byte[] z : body.zips) {
                      String xml = xmlFromZip(z);
                      if (xml != null) { it = Parser.ubl(xml); break; }
                  }
                  if (it == null) {
                      it = Parser.text(from, subject, text);
                      if (it == null || it.provider.isEmpty() || !known(from)) return; // tanınmayan gönderen (banka vb.)
                  } else {
                      Parser.Item t2 = Parser.text(from, subject, text);
                      if (t2 != null && it.link.isEmpty()) it.link = t2.link;
                  }
                  JSONObject b = BillStore.add(o, it, key, date, "mail");
                  if (b != null) { r.newBills++; r.added.add(b); }
              }

              static boolean wanted(Message m) {
                  try {
                      String subj = m.getSubject() == null ? "" : m.getSubject().toLowerCase(java.util.Locale.ROOT);
                      if (subj.contains("fatura") || subj.contains("borç") || subj.contains("borc")) return true;
                      Address[] fa = m.getFrom();
                      String from = fa != null && fa.length > 0 ? fa[0].toString() : "";
                      return known(from);
                  } catch (Exception e) { return false; }
              }

              static boolean known(String from) {
                  String f = from.toLowerCase(java.util.Locale.ROOT);
                  for (String s : SENDERS) if (f.contains(s)) return true;
                  return false;
              }

              static final class Body {
                  StringBuilder plain = new StringBuilder(), html = new StringBuilder();
                  List<byte[]> zips = new ArrayList<>();
              }

              static void collect(Part p, Body b) throws Exception {
                  String fn = p.getFileName();
                  if (p.isMimeType("multipart/*")) {
                      Multipart mp = (Multipart) p.getContent();
                      for (int i = 0; i < mp.getCount(); i++) collect(mp.getBodyPart(i), b);
                  } else if (fn != null && fn.toLowerCase(java.util.Locale.ROOT).endsWith(".zip")) {
                      if (p.getSize() < 5_000_000) b.zips.add(read(p.getInputStream()));
                  } else if (fn == null && p.isMimeType("text/plain")) {
                      b.plain.append(String.valueOf(p.getContent())).append('\n');
                  } else if (fn == null && p.isMimeType("text/html")) {
                      b.html.append(String.valueOf(p.getContent())).append('\n');
                  } else if (p instanceof BodyPart && p.isMimeType("message/rfc822")) {
                      // iletilmiş mail: atla
                  }
              }

              static byte[] read(InputStream in) throws Exception {
                  ByteArrayOutputStream o = new ByteArrayOutputStream();
                  byte[] buf = new byte[16384];
                  int n;
                  while ((n = in.read(buf)) > 0) o.write(buf, 0, n);
                  in.close();
                  return o.toByteArray();
              }

              static String xmlFromZip(byte[] z) {
                  try {
                      ZipInputStream zin = new ZipInputStream(new java.io.ByteArrayInputStream(z));
                      ZipEntry e;
                      while ((e = zin.getNextEntry()) != null) {
                          if (e.getName().toLowerCase(java.util.Locale.ROOT).endsWith(".xml")) {
                              String x = new String(read(zin), StandardCharsets.UTF_8);
                              if (x.contains("cbc:Note")) return x;
                              return x;
                          }
                      }
                  } catch (Exception ignored) {}
                  return null;
              }

              static String stripHtml(String h) {
                  return h.replaceAll("(?is)<(script|style)[^>]*>.*?</\\1>", " ")
                          .replaceAll("(?i)<br\\s*/?>|</p>|</div>|</tr>", "\n")
                          .replaceAll("(?is)<a[^>]*href=\"([^\"]+)\"[^>]*>", " $1 ")
                          .replaceAll("<[^>]+>", " ")
                          .replace("&nbsp;", " ").replace("&amp;", "&").replace("&quot;", "\"")
                          .replaceAll("&#(\\d+);", " ")
                          .replaceAll("[ \\t]+", " ");
              }

              /** Ayar ekranındaki "Bağlantıyı test et" için. */
              public static String testLogin(Context ctx) {
                  com.altintas.faturasms.Store st = new com.altintas.faturasms.Store(ctx);
                  try {
                      Properties p = new Properties();
                      p.put("mail.imaps.connectiontimeout", "20000");
                      p.put("mail.imaps.timeout", "20000");
                      Store store = Session.getInstance(p).getStore("imaps");
                      store.connect("imap.gmail.com", st.email(), st.pass());
                      store.close();
                      return null;
                  } catch (Exception e) {
                      return mailError(e);
                  }
              }
          }
