          mkdir -p 'app/src/main/java/com/altintas/faturasms'
          cat > 'app/src/main/java/com/altintas/faturasms/BillFilter.java' <<'FATURA_EOF'
          package com.altintas.faturasms;

          import java.util.Locale;
          import java.util.regex.Pattern;

          /** Hangi SMS'in fatura/borç bildirimi olduğuna karar verir. Android'e bağımlı değil. */
          public final class BillFilter {
              private BillFilter() {}

              // Bilinen kurum gönderen adları (normalize edilmiş, küçük harf, Türkçe karaktersiz)
              private static final Pattern SENDER = Pattern.compile(
                      "(\\bck\\b|ckbogazici|bogazici|ckenerji|enerjisa|iski|igdas|aksa|gaz|elektrik|edas|bedas|ayedas|"
                      + "toroslar|baskent|aski|izsu|buski|meski|koski|asat|suski|\\bsu\\b)");

              // Fatura/borç içeriği
              private static final Pattern CONTENT = Pattern.compile(
                      "(fatura|son odeme|borcunuz|borc bilgi|odenmemis|abone|tesisat|sozlesme hesab|\\bkwh\\b|\\bm3\\b|tuketim)");

              // Tutar
              private static final Pattern AMOUNT = Pattern.compile("(\\d[\\d.,]*\\s*(tl|try)\\b|tutar)");

              // Asla iletilmeyecek özel mesajlar (doğrulama kodları vb.)
              private static final Pattern PRIVATE = Pattern.compile(
                      "(sifre|dogrulama|onay kodu|tek kullanimlik|\\botp\\b|parola|guvenlik kodu|giris kodu|kodunuz)");

              // Fatura olmayan duyurular (kesinti, kampanya vb.)
              private static final Pattern NOISE = Pattern.compile(
                      "(su verilemeyecek|kesintisi|kesinti yapilacak|enerjilendirme|planli elektrik|sozlesme teklif|dijital faturaya gec|kagit tuketimini)");

              public static String norm(String s) {
                  if (s == null) return "";
                  StringBuilder b = new StringBuilder(s.length());
                  for (int i = 0; i < s.length(); i++) {
                      char c = s.charAt(i);
                      switch (c) {
                          case 'İ': case 'I': case 'ı': b.append('i'); break;
                          case 'Ş': case 'ş': b.append('s'); break;
                          case 'Ğ': case 'ğ': b.append('g'); break;
                          case 'Ü': case 'ü': b.append('u'); break;
                          case 'Ö': case 'ö': b.append('o'); break;
                          case 'Ç': case 'ç': b.append('c'); break;
                          case '³': b.append('3'); break;
                          case '̇': break; // birleşik nokta
                          default: b.append(Character.toLowerCase(c));
                      }
                  }
                  return b.toString().toLowerCase(Locale.ROOT);
              }

              public static boolean isBill(String from, String body) {
                  String f = norm(from), t = norm(body);
                  if (PRIVATE.matcher(t).find()) return false;
                  if (NOISE.matcher(t).find()) return false;
                  boolean content = CONTENT.matcher(t).find();
                  if (!content) return false;
                  boolean sender = SENDER.matcher(f).find() || SENDER.matcher(t).find();
                  boolean amount = AMOUNT.matcher(t).find();
                  return sender || (amount && t.contains("fatura"));
              }
          }
          FATURA_EOF
          mkdir -p 'app/src/main/java/com/altintas/faturasms'
          cat > 'app/src/main/java/com/altintas/faturasms/DigestReceiver.java' <<'FATURA_EOF'
          package com.altintas.faturasms;

          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          /** Günde birkaç kez uyanır; özet zamanı geldiyse tek mail gönderir. Telefon açılınca alarmı yeniden kurar. */
          public class DigestReceiver extends BroadcastReceiver {
              public static void arm(Context ctx) {
                  AlarmManager am = (AlarmManager) ctx.getSystemService(Context.ALARM_SERVICE);
                  if (am == null) return;
                  Intent i = new Intent(ctx, DigestReceiver.class).setAction("com.altintas.faturasms.DIGEST");
                  PendingIntent pi = PendingIntent.getBroadcast(ctx, 7, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  am.setInexactRepeating(AlarmManager.RTC_WAKEUP, System.currentTimeMillis() + 15 * 60000L,
                          AlarmManager.INTERVAL_HOUR * 3, pi);
              }

              @Override
              public void onReceive(final Context context, Intent intent) {
                  if (Intent.ACTION_BOOT_COMPLETED.equals(intent.getAction()) || Intent.ACTION_MY_PACKAGE_REPLACED.equals(intent.getAction())) {
                      arm(context);
                      return;
                  }
                  final PendingResult pr = goAsync();
                  new Thread(new Runnable() {
                      public void run() {
                          try { Forwarder.sendDigest(context, false); } catch (Throwable ignored) {} finally { pr.finish(); }
                      }
                  }).start();
              }
          }
          FATURA_EOF
          mkdir -p 'app/src/main/java/com/altintas/faturasms'
          cat > 'app/src/main/java/com/altintas/faturasms/Forwarder.java' <<'FATURA_EOF'
          package com.altintas.faturasms;

          import android.content.ContentResolver;
          import android.content.Context;
          import android.database.Cursor;
          import android.net.Uri;
          import android.provider.Telephony;

          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Calendar;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.Date;
          import java.util.List;
          import java.util.Locale;

          /**
           * Fatura SMS'lerini biriktirir ve seçilen günde tek bir özet maili olarak Gmail'e gönderir.
           * Ağ işlemi yaptığı için ana iş parçacığında çağrılmamalı.
           */
          public final class Forwarder {
              private Forwarder() {}

              public static final String HOST = "smtp.gmail.com";
              public static final int PORT = 465;
              private static final int MAX_PER_MAIL = 40;

              public static class Result {
                  public int found, added, sent, mails;
                  public String error;
              }

              /** Fatura SMS'lerini özet kuyruğuna ekler. Mail göndermez. */
              public static synchronized Result collect(Context ctx, List<Sms> incoming) {
                  Store st = new Store(ctx);
                  Result r = new Result();
                  List<Sms> q = st.queue();
                  List<String> keys = new ArrayList<>();
                  for (Sms s : q) keys.add(s.key());
                  for (Sms s : incoming) {
                      if (!BillFilter.isBill(s.from, s.body)) continue;
                      r.found++;
                      String k = s.key();
                      if (keys.contains(k) || st.isSent(k)) continue;
                      keys.add(k);
                      q.add(s);
                      r.added++;
                  }
                  // Daha önce biriken kesinti/kampanya SMS'lerini de temizle
                  List<Sms> clean = new ArrayList<>();
                  for (Sms s : q) if (BillFilter.isBill(s.from, s.body)) clean.add(s);
                  st.setQueue(clean);
                  if (r.added > 0) st.log("Özete eklendi: " + r.added + " SMS (bekleyen " + clean.size() + ")");
                  return r;
              }

              /** Bir sonraki özet zamanı (ms). Kapalıysa 0. */
              public static long nextDigest(Store st) {
                  int mode = st.digestMode();
                  if (mode == 3) return 0;
                  Calendar c = Calendar.getInstance();
                  c.setTimeInMillis(st.lastDigest());
                  c.set(Calendar.HOUR_OF_DAY, 9); c.set(Calendar.MINUTE, 0); c.set(Calendar.SECOND, 0); c.set(Calendar.MILLISECOND, 0);
                  long last = st.lastDigest();
                  for (int i = 0; i < 400; i++) {
                      if (c.getTimeInMillis() > last) {
                          int dow = c.get(Calendar.DAY_OF_WEEK), dom = c.get(Calendar.DAY_OF_MONTH);
                          if (mode == 0 && dow == Calendar.MONDAY) break;
                          if (mode == 1 && (dom == 1 || dom == 15)) break;
                          if (mode == 2 && dom == 15) break;
                      }
                      c.add(Calendar.DAY_OF_MONTH, 1);
                  }
                  return c.getTimeInMillis();
              }

              /** Zamanı geldiyse (ya da force ise) biriken SMS'leri tek mail olarak gönderir. */
              public static synchronized Result sendDigest(Context ctx, boolean force) {
                  Store st = new Store(ctx);
                  Result r = new Result();
                  List<Sms> q = st.queue();
                  r.found = q.size();
                  if (!force) {
                      long next = nextDigest(st);
                      if (next == 0 || System.currentTimeMillis() < next) return r;
                  }
                  if (q.isEmpty()) {
                      if (!force) st.setLastDigest(System.currentTimeMillis());
                      return r;
                  }
                  if (!st.configured()) { r.error = "Gmail adresi ve uygulama şifresi girilmemiş"; return r; }
                  Collections.sort(q, new Comparator<Sms>() { public int compare(Sms a, Sms b) { return Long.compare(a.date, b.date); } });
                  List<Sms> left = new ArrayList<>(q);
                  try {
                      while (!left.isEmpty()) {
                          List<Sms> part = new ArrayList<>(left.subList(0, Math.min(MAX_PER_MAIL, left.size())));
                          Smtp.send(HOST, PORT, true, st.email(), st.pass(), st.email(), digestSubject(part), digestBody(part));
                          for (Sms s : part) st.markSent(s.key());
                          left.removeAll(part);
                          st.setQueue(left);
                          r.sent += part.size(); r.mails++;
                      }
                      st.setLastDigest(System.currentTimeMillis());
                      st.log("Özet maili gönderildi: " + r.sent + " SMS");
                  } catch (Smtp.SmtpException e) {
                      r.error = e.code == 535 || e.code == 534
                              ? "Gmail şifreyi kabul etmedi. 16 haneli uygulama şifresi gerekli."
                              : "Gmail hatası (" + e.code + ")";
                      st.log("Hata: " + r.error);
                  } catch (Exception e) {
                      r.error = "İnternet yok veya Gmail'e ulaşılamadı";
                      st.log("Hata: " + r.error + " — sonraki kontrolde tekrar denenecek");
                  }
                  return r;
              }

              /** Gelen kutusundaki son N günün SMS'leri. */
              public static List<Sms> readInbox(Context ctx, int days) {
                  List<Sms> out = new ArrayList<>();
                  long since = System.currentTimeMillis() - days * 86400000L;
                  ContentResolver cr = ctx.getContentResolver();
                  Uri uri = Telephony.Sms.Inbox.CONTENT_URI;
                  String[] proj = {Telephony.Sms.ADDRESS, Telephony.Sms.BODY, Telephony.Sms.DATE};
                  Cursor c = null;
                  try {
                      c = cr.query(uri, proj, Telephony.Sms.DATE + " > ?", new String[]{String.valueOf(since)}, Telephony.Sms.DATE + " ASC");
                      if (c != null) {
                          while (c.moveToNext()) out.add(new Sms(c.getString(0), c.getString(1), c.getLong(2)));
                      }
                  } finally {
                      if (c != null) c.close();
                  }
                  return out;
              }

              static String fmt(long t) { return new SimpleDateFormat("dd.MM.yyyy HH:mm", new Locale("tr")).format(new Date(t)); }
              static String day(long t) { return new SimpleDateFormat("dd.MM.yyyy", new Locale("tr")).format(new Date(t)); }

              public static String digestSubject(List<Sms> l) {
                  return "Fatura SMS Özeti - " + day(System.currentTimeMillis()) + " (" + l.size() + " SMS)";
              }

              public static String digestBody(List<Sms> l) {
                  StringBuilder b = new StringBuilder();
                  b.append("Telefondaki fatura SMS'lerinin özeti (Fatura SMS uygulaması). Toplam ").append(l.size()).append(" SMS.\n\n");
                  int i = 0;
                  for (Sms s : l) {
                      i++;
                      b.append("===== SMS ").append(i).append("/").append(l.size()).append(" =====\n");
                      b.append("Gönderen: ").append(s.from).append("\n");
                      b.append("SMS tarihi: ").append(fmt(s.date)).append("\n\n");
                      b.append(s.body.trim()).append("\n\n");
                  }
                  return b.toString();
              }
          }
          FATURA_EOF
          mkdir -p 'app/src/main/java/com/altintas/faturasms'
          cat > 'app/src/main/java/com/altintas/faturasms/InstallReceiver.java' <<'FATURA_EOF'
          package com.altintas.faturasms;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageInstaller;
          import android.widget.Toast;

          /** Kurulum oturumunun sonucunu alır; kullanıcı onayı gerekiyorsa sistemin kurulum ekranını açar. */
          public class InstallReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  int status = intent.getIntExtra(PackageInstaller.EXTRA_STATUS, PackageInstaller.STATUS_FAILURE);
                  if (status == PackageInstaller.STATUS_PENDING_USER_ACTION) {
                      Intent confirm = intent.getParcelableExtra(Intent.EXTRA_INTENT);
                      if (confirm != null) {
                          confirm.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          context.startActivity(confirm);
                      }
                  } else if (status == PackageInstaller.STATUS_SUCCESS) {
                      new Store(context).log("Uygulama güncellendi");
                  } else {
                      String msg = intent.getStringExtra(PackageInstaller.EXTRA_STATUS_MESSAGE);
                      new Store(context).log("Güncelleme kurulamadı: " + (msg == null ? status : msg));
                      Toast.makeText(context, "Güncelleme kurulamadı", Toast.LENGTH_LONG).show();
                  }
              }
          }
          FATURA_EOF
          mkdir -p 'app/src/main/java/com/altintas/faturasms'
          cat > 'app/src/main/java/com/altintas/faturasms/MainActivity.java' <<'FATURA_EOF'
          package com.altintas.faturasms;

          import android.Manifest;
          import android.app.Activity;
          import android.app.PendingIntent;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.PowerManager;
          import android.provider.Settings;
          import android.text.InputType;
          import android.util.TypedValue;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends Activity {
              private Store store;
              private EditText email, pass;
              private TextView status, log;
              private Button scanBtn, testBtn, updBtn, digestBtn;
              private android.widget.RadioGroup modeGroup;
              private TextView updText;
              private Updater.Release pending;
              private boolean checkedUpdate;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  store = new Store(this);
                  DigestReceiver.arm(this);
                  // Kurulum tamamsa doğrudan kartlı Fatura Takip ekranını aç
                  boolean wantSettings = getIntent() != null && (getIntent().getBooleanExtra("settings", false)
                          || ACTION_SETTINGS.equals(getIntent().getAction()));
                  if (!wantSettings && hasSms() && store.configured()) {
                      openTakip();
                      finish();
                      return;
                  }
                  setTitle("Fatura Takip · SMS ayarları");

                  ScrollView sv = new ScrollView(this);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  int p = dp(18);
                  root.setPadding(p, p, p, p);
                  sv.addView(root);

                  root.addView(text("Fatura Takip", 22, true));
                  Button openBtn = button("📊 Faturalarımı aç");
                  openBtn.setOnClickListener(new View.OnClickListener() { public void onClick(View v) { openTakip(); } });
                  root.addView(openBtn);
                  root.addView(label("SMS ayarları"));
                  root.addView(text("CK Boğaziçi, İSKİ, İGDAŞ gibi kurumlardan gelen fatura SMS'lerini biriktirir ve seçtiğin günde "
                          + "Gmail'ine TEK bir özet maili olarak gönderir. Fatura Takip bu özeti okur. "
                          + "Kesinti duyuruları, kampanyalar, doğrulama kodları ve banka mesajları gönderilmez.", 14, false));

                  root.addView(label("Gmail adresi"));
                  email = new EditText(this);
                  email.setInputType(InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_VARIATION_EMAIL_ADDRESS);
                  email.setText(store.email());
                  email.setHint("ornek@gmail.com");
                  root.addView(email);

                  root.addView(label("Gmail uygulama şifresi (16 haneli)"));
                  pass = new EditText(this);
                  pass.setInputType(InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_VARIATION_PASSWORD);
                  pass.setHint(store.pass().isEmpty() ? "abcd efgh ijkl mnop" : "Kayıtlı (değiştirmek için yaz)");
                  root.addView(pass);
                  root.addView(text("Normal Gmail şifren değil. myaccount.google.com/apppasswords adresinden alınır.", 12, false));

                  testBtn = button("Kaydet ve test maili gönder");
                  testBtn.setOnClickListener(new View.OnClickListener() { public void onClick(View v) { saveAndTest(); } });
                  root.addView(testBtn);

                  root.addView(label("Özet maili ne zaman gelsin?"));
                  modeGroup = new android.widget.RadioGroup(this);
                  String[] modes = {"Haftada bir (Pazartesi sabahı)", "Ayda iki kez (1'i ve 15'i)", "Ayda bir (15'i)", "Hiç otomatik gönderme (sadece ben basınca)"};
                  for (int i = 0; i < modes.length; i++) {
                      android.widget.RadioButton rb = new android.widget.RadioButton(this);
                      rb.setText(modes[i]); rb.setId(1000 + i);
                      modeGroup.addView(rb);
                  }
                  modeGroup.check(1000 + store.digestMode());
                  modeGroup.setOnCheckedChangeListener(new android.widget.RadioGroup.OnCheckedChangeListener() {
                      public void onCheckedChanged(android.widget.RadioGroup g, int id) { store.setDigestMode(id - 1000); refresh(); }
                  });
                  root.addView(modeGroup);

                  digestBtn = button("Özeti şimdi gönder (test)");
                  digestBtn.setOnClickListener(new View.OnClickListener() { public void onClick(View v) { sendNow(); } });
                  root.addView(digestBtn);

                  scanBtn = button("Eski fatura SMS'lerini özete ekle (son 120 gün)");
                  scanBtn.setOnClickListener(new View.OnClickListener() { public void onClick(View v) { scan(); } });
                  root.addView(scanBtn);

                  Button bat = button("Arka planda çalışmasına izin ver (pil)");
                  bat.setOnClickListener(new View.OnClickListener() { public void onClick(View v) { askBattery(); } });
                  root.addView(bat);

                  status = text("", 15, true);
                  status.setPadding(0, dp(14), 0, dp(6));
                  root.addView(status);

                  root.addView(label("Güncelleme"));
                  updText = text("Sürüm " + Updater.installedName(this), 13, false);
                  root.addView(updText);
                  updBtn = button("Güncelle");
                  updBtn.setOnClickListener(new View.OnClickListener() { public void onClick(View v) { onUpdateClick(); } });
                  root.addView(updBtn);

                  root.addView(label("Son işlemler"));
                  log = text("", 12, false);
                  log.setTypeface(Typeface.MONOSPACE);
                  root.addView(log);

                  setContentView(sv);
                  askSmsPermission();
                  DigestReceiver.arm(this);
                  refresh();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (status == null) return;
                  refresh();
                  // Uygulama açılınca mail GÖNDERİLMEZ; sadece durum gösterilir.
              }

              static final String TAKIP_URL = "https://claude.ai/artifact/B7D98A57KXh27nJ8GN3iVN";
              static final String ACTION_SETTINGS = "com.altintas.faturasms.SETTINGS";

              /** Fatura Takip sayfasını uygulama içi tarayıcı sekmesinde (Custom Tab) açar; menüye "SMS ayarları" ekler. */
              private void openTakip() {
                  Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse(TAKIP_URL));
                  Bundle extras = new Bundle();
                  extras.putBinder("android.support.customtabs.extra.SESSION", null);
                  i.putExtras(extras);
                  i.putExtra("android.support.customtabs.extra.TOOLBAR_COLOR", 0xFF1B9FBD);
                  i.putExtra("android.support.customtabs.extra.TITLE_VISIBILITY", 0);
                  i.putExtra("android.support.customtabs.extra.SHARE_STATE", 2);
                  Intent st = new Intent(this, MainActivity.class).setAction(ACTION_SETTINGS).putExtra("settings", true);
                  PendingIntent pi = PendingIntent.getActivity(this, 11, st, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  Bundle item = new Bundle();
                  item.putString("android.support.customtabs.customaction.MENU_ITEM_TITLE", "⚙️ SMS ayarları / güncelleme");
                  item.putParcelable("android.support.customtabs.customaction.PENDING_INTENT", pi);
                  ArrayList<Bundle> items = new ArrayList<>();
                  items.add(item);
                  i.putParcelableArrayListExtra("android.support.customtabs.extra.MENU_ITEMS", items);
                  try {
                      startActivity(i);
                  } catch (Exception e) {
                      try { startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(TAKIP_URL))); } catch (Exception ignored) {}
                  }
              }

              /* ---- güncelleme ---- */
              private void onUpdateClick() {
                  if (pending != null) installUpdate(); else checkUpdate(true);
              }

              private void checkUpdate(final boolean manual) {
                  updBtn.setEnabled(false);
                  if (manual) updText.setText("Yeni sürüm aranıyor…");
                  new Thread(new Runnable() {
                      public void run() {
                          String msg;
                          Updater.Release r = null;
                          try {
                              r = Updater.latest();
                              long cur = Updater.installedVersion(MainActivity.this);
                              if (r != null && r.versionCode > cur) msg = "🆕 Yeni sürüm var (" + r.versionCode + ")." + (r.notes == null || r.notes.isEmpty() ? "" : "\n" + r.notes);
                              else { r = null; msg = "✅ En son sürümü kullanıyorsun (" + Updater.installedName(MainActivity.this) + ")."; }
                          } catch (Exception e) {
                              msg = manual ? "Güncelleme kontrol edilemedi: " + e.getMessage() : "Sürüm " + Updater.installedName(MainActivity.this);
                          }
                          final String m = msg;
                          final Updater.Release rr = r;
                          runOnUiThread(new Runnable() {
                              public void run() {
                                  pending = rr;
                                  updText.setText(m);
                                  updBtn.setText("Güncelle");
                                  updBtn.setEnabled(true);
                                  if (rr != null && manual) installUpdate();
                              }
                          });
                      }
                  }).start();
              }

              private void installUpdate() {
                  if (!getPackageManager().canRequestPackageInstalls()) {
                      updText.setText("Önce açılan ekranda \"Bu kaynaktan izin ver\"i aç, sonra geri dönüp tekrar bas.");
                      startActivity(new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:" + getPackageName())));
                      return;
                  }
                  final String url = pending.apkUrl;
                  updBtn.setEnabled(false);
                  updText.setText("Yeni sürüm indiriliyor…");
                  new Thread(new Runnable() {
                      public void run() {
                          String m;
                          try {
                              Updater.downloadAndInstall(MainActivity.this, url);
                              m = "Kurulum ekranı açılıyor, \"Güncelle\"ye bas.";
                          } catch (Exception e) {
                              m = "İndirilemedi: " + e.getMessage();
                          }
                          final String mm = m;
                          runOnUiThread(new Runnable() { public void run() { updText.setText(mm); updBtn.setEnabled(true); } });
                      }
                  }).start();
              }

              private void refresh() {
                  if (status == null) return;
                  boolean perm = hasSms();
                  String s;
                  if (!perm) s = "⚠️ SMS izni verilmedi. Uygulama çalışamaz.";
                  else if (!store.configured()) s = "⚠️ Gmail uygulama şifresini gir ve test et.";
                  else {
                      long n = Forwarder.nextDigest(store);
                      s = "✅ Hazır. Özette bekleyen: " + store.queue().size() + " SMS"
                          + (n == 0 ? " · Otomatik gönderim kapalı" : " · Sonraki özet: " + Forwarder.day(n))
                          + " · Şimdiye kadar iletilen: " + store.sentCount();
                  }
                  status.setText(s);
                  log.setText(store.logText());
              }

              private void saveAndTest() {
                  String e = email.getText().toString().trim();
                  String pw = pass.getText().toString().replace(" ", "").trim();
                  if (e.isEmpty() || !e.contains("@")) { status.setText("Geçerli bir Gmail adresi yaz."); return; }
                  if (pw.isEmpty()) pw = store.pass();
                  if (pw.length() != 16) { status.setText("Uygulama şifresi 16 harf olmalı (boşluklar hariç)."); return; }
                  store.saveCreds(e, pw);
                  pass.setText("");
                  pass.setHint("Kayıtlı (değiştirmek için yaz)");
                  setBusy(true, "Test maili gönderiliyor…");
                  final String to = e, pwd = pw;
                  new Thread(new Runnable() {
                      public void run() {
                          String msg;
                          try {
                              Smtp.send(Forwarder.HOST, Forwarder.PORT, true, to, pwd, to, "Fatura SMS test",
                                      "Fatura SMS uygulaması Gmail'e bağlandı. Bu maili silebilirsin.");
                              store.log("Test maili gönderildi");
                              msg = "✅ Test maili gönderildi.";
                          } catch (Smtp.SmtpException ex) {
                              msg = (ex.code == 535 || ex.code == 534)
                                      ? "❌ Gmail şifreyi kabul etmedi. 16 haneli uygulama şifresini kontrol et (2 adımlı doğrulama açık olmalı)."
                                      : "❌ Gmail hatası: " + ex.code;
                              store.log(msg);
                          } catch (Exception ex) {
                              msg = "❌ Gmail'e ulaşılamadı. İnternet bağlantını kontrol et.";
                              store.log(msg);
                          }
                          final String m = msg;
                          runOnUiThread(new Runnable() { public void run() { setBusy(false, null); refresh(); status.setText(m); } });
                      }
                  }).start();
              }

              private void scan() {
                  if (!hasSms()) { askSmsPermission(); return; }
                  if (!store.configured()) { status.setText("Önce Gmail uygulama şifresini girip test et."); return; }
                  List<Sms> inbox;
                  try {
                      inbox = Forwarder.readInbox(this, 120);
                  } catch (Exception e) {
                      status.setText("SMS'ler okunamadı: " + e.getMessage());
                      return;
                  }
                  Forwarder.Result r = Forwarder.collect(this, inbox);
                  refresh();
                  status.setText(inbox.size() + " SMS tarandı. " + r.added + " fatura SMS'i özete eklendi (bekleyen " + store.queue().size() + "). Mail gönderilmedi.");
              }

              private void sendNow() {
                  if (!store.configured()) { status.setText("Önce Gmail uygulama şifresini girip test et."); return; }
                  if (store.queue().isEmpty()) { status.setText("Özette bekleyen SMS yok. Önce \"Eski fatura SMS'lerini özete ekle\"ye basabilirsin."); return; }
                  setBusy(true, "Özet maili gönderiliyor…");
                  new Thread(new Runnable() {
                      public void run() {
                          final Forwarder.Result r = Forwarder.sendDigest(MainActivity.this, true);
                          runOnUiThread(new Runnable() {
                              public void run() {
                                  setBusy(false, null);
                                  refresh();
                                  status.setText(r.error != null ? "❌ " + r.error
                                          : "✅ " + r.sent + " SMS tek özet mailinde gönderildi" + (r.mails > 1 ? " (" + r.mails + " parça)" : "") + ".");
                              }
                          });
                      }
                  }).start();
              }

              private void setBusy(boolean busy, String msg) {
                  scanBtn.setEnabled(!busy);
                  digestBtn.setEnabled(!busy);
                  testBtn.setEnabled(!busy);
                  if (msg != null) status.setText(msg);
              }

              private boolean hasSms() {
                  return checkSelfPermission(Manifest.permission.READ_SMS) == PackageManager.PERMISSION_GRANTED
                          && checkSelfPermission(Manifest.permission.RECEIVE_SMS) == PackageManager.PERMISSION_GRANTED;
              }

              private void askSmsPermission() {
                  if (!hasSms()) requestPermissions(new String[]{Manifest.permission.READ_SMS, Manifest.permission.RECEIVE_SMS}, 1);
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  refresh();
              }

              private void askBattery() {
                  try {
                      PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                      if (Build.VERSION.SDK_INT >= 23 && pm != null && !pm.isIgnoringBatteryOptimizations(getPackageName())) {
                          Intent i = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
                          i.setData(Uri.parse("package:" + getPackageName()));
                          startActivity(i);
                      } else {
                          status.setText("✅ Pil kısıtlaması zaten kapalı.");
                      }
                  } catch (Exception e) {
                      startActivity(new Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS));
                  }
              }

              /* ---- küçük arayüz yardımcıları ---- */
              private int dp(int v) { return (int) TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v, getResources().getDisplayMetrics()); }

              private TextView text(String s, int sp, boolean bold) {
