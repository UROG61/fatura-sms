          package com.altintas.faturasms;

          import android.content.Context;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.nio.charset.StandardCharsets;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Iterator;
          import java.util.Locale;

          /**
           * Faturalar, borç bildirimleri ve kullanıcının işaretleri telefonda (uygulamanın kendi klasöründe) saklanır.
           * Veri: {bills:[...], notices:[...], subState:{}, names:{}, seen:{}, mailSince:ms, smsSince:ms}
           */
          public final class BillStore {
              private static final String FILE = "faturalar.json";
              private static final Object LOCK = new Object();
              private final Context ctx;

              public BillStore(Context c) { ctx = c.getApplicationContext(); }

              public static String today() { return new SimpleDateFormat("yyyy-MM-dd", Locale.ROOT).format(new Date()); }

              static String dayOffset(int d) {
                  return new SimpleDateFormat("yyyy-MM-dd", Locale.ROOT).format(new Date(System.currentTimeMillis() + d * 86400000L));
              }

              public JSONObject load() {
                  synchronized (LOCK) {
                      try {
                          File f = new File(ctx.getFilesDir(), FILE);
                          if (!f.exists()) return empty();
                          byte[] b = new byte[(int) f.length()];
                          FileInputStream in = new FileInputStream(f);
                          int off = 0, n;
                          while (off < b.length && (n = in.read(b, off, b.length - off)) > 0) off += n;
                          in.close();
                          JSONObject o = new JSONObject(new String(b, StandardCharsets.UTF_8));
                          for (String k : new String[]{"bills", "notices"}) if (!o.has(k)) o.put(k, new JSONArray());
                          for (String k : new String[]{"subState", "names", "seen"}) if (!o.has(k)) o.put(k, new JSONObject());
                          return o;
                      } catch (Exception e) {
                          return empty();
                      }
                  }
              }

              static JSONObject empty() {
                  JSONObject o = new JSONObject();
                  try {
                      o.put("bills", new JSONArray()); o.put("notices", new JSONArray());
                      o.put("subState", new JSONObject()); o.put("names", new JSONObject()); o.put("seen", new JSONObject());
                  } catch (Exception ignored) {}
                  return o;
              }

              public void save(JSONObject o) {
                  synchronized (LOCK) {
                      try {
                          o.put("updatedAt", System.currentTimeMillis());
                          File tmp = new File(ctx.getFilesDir(), FILE + ".tmp");
                          FileOutputStream out = new FileOutputStream(tmp);
                          out.write(o.toString().getBytes(StandardCharsets.UTF_8));
                          out.close();
                          tmp.renameTo(new File(ctx.getFilesDir(), FILE));
                      } catch (Exception ignored) {}
                  }
              }

              /* ---------------- ekleme ---------------- */

              public static boolean seen(JSONObject o, String key) { return o.optJSONObject("seen") != null && o.optJSONObject("seen").has(key); }

              public static void markSeen(JSONObject o, String key) {
                  try { o.getJSONObject("seen").put(key, 1); } catch (Exception ignored) {}
              }

              static String subKey(String provider, String aboneNo) {
                  return (aboneNo == null || aboneNo.isEmpty()) ? "p:" + provider : "a:" + aboneNo;
              }

              /**
               * Çözülmüş bir öğeyi ekler. Yeni bir fatura eklendiyse onu döndürür, yoksa null.
               * @param date kaynağın (SMS / mail) tarihi, ms
               */
              public static JSONObject add(JSONObject o, Parser.Item it, String srcKey, long date, String source) {
                  try {
                      if (it == null || "info".equals(it.kind)) return null;
                      String d = new SimpleDateFormat("yyyy-MM-dd", Locale.ROOT).format(new Date(date));
                      if ("debt".equals(it.kind)) {
                          JSONArray ns = o.getJSONArray("notices");
                          String id = "n" + Math.abs((it.provider + it.aboneNo + d + it.amount).hashCode());
                          for (int i = 0; i < ns.length(); i++) if (id.equals(ns.getJSONObject(i).optString("id"))) return null;
                          JSONObject n = new JSONObject();
                          n.put("id", id); n.put("date", d); n.put("provider", it.provider); n.put("type", it.type);
                          n.put("aboneNo", it.aboneNo); n.put("text", it.text); n.put("kind", "borc");
                          if (it.amount > 0) n.put("amount", it.amount);
                          ns.put(n);
                          return null;
                      }
                      if (it.amount <= 0) return null;
                      JSONArray bs = o.getJSONArray("bills");
                      // Aynı fatura başka kaynaktan gelmiş mi? (SMS + mail)
                      for (int i = 0; i < bs.length(); i++) {
                          JSONObject b = bs.getJSONObject(i);
                          boolean sameAcc = !it.aboneNo.isEmpty() ? it.aboneNo.equals(b.optString("aboneNo"))
                                  : it.provider.equals(b.optString("provider")) && b.optString("aboneNo").isEmpty();
                          if (!sameAcc) continue;
                          boolean samePer = !it.period.isEmpty() && it.period.equals(b.optString("period"));
                          boolean sameDue = !it.dueDate.isEmpty() && it.dueDate.equals(b.optString("dueDate"));
                          boolean sameAmt = Math.abs(b.optDouble("amount", 0) - it.amount) < 0.6;
                          if ((samePer || sameDue) && (sameAmt || it.noPay == b.optBoolean("noPay"))) {
                              if (sameAmt || (samePer && sameDue)) {
                                  enrich(b, it);
                                  return null;
                              }
                          }
                      }
                      JSONObject b = new JSONObject();
                      b.put("id", "b" + Math.abs((srcKey + it.aboneNo + it.amount).hashCode()) + "_" + bs.length());
                      b.put("type", it.type); b.put("provider", it.provider); b.put("aboneNo", it.aboneNo);
                      b.put("period", it.period); b.put("amount", it.amount); b.put("dueDate", it.dueDate);
                      b.put("source", source); b.put("createdAt", System.currentTimeMillis()); b.put("srcDate", d);
                      enrich(b, it);
                      if (it.noPay) { b.put("noPay", true); b.put("paid", true); b.put("note", it.text); }
                      else if (!it.dueDate.isEmpty() && it.dueDate.compareTo(dayOffset(-10)) < 0) {
                          // Son ödemesi epey geçmiş eski fatura: ödendi varsay, kullanıcı onaylar
                          b.put("paid", true); b.put("assumed", true);
                      } else b.put("paid", false);
                      bs.put(b);
                      return b;
                  } catch (Exception e) {
                      return null;
                  }
              }

              static void enrich(JSONObject b, Parser.Item it) throws Exception {
                  if (!it.link.isEmpty() && b.optString("link").isEmpty()) b.put("link", it.link);
                  if (it.consumption != null && b.isNull("consumption")) b.put("consumption", it.consumption);
                  if (!it.unit.isEmpty() && b.optString("unit").isEmpty()) b.put("unit", it.unit);
                  if (!it.addr.isEmpty() && b.optString("addr").isEmpty()) b.put("addr", it.addr);
                  if (!it.invNo.isEmpty() && b.optString("invNo").isEmpty()) b.put("invNo", it.invNo);
                  if (!it.period.isEmpty() && b.optString("period").isEmpty()) b.put("period", it.period);
                  if (it.det != null && !b.has("det")) {
                      JSONObject d = new JSONObject();
                      for (java.util.Map.Entry<String, String> e : it.det.entrySet()) d.put(e.getKey(), e.getValue());
                      b.put("det", d);
                  }
              }

              /* ---------------- kullanıcı işlemleri ---------------- */

              public void setPaid(String id, boolean paid) {
                  JSONObject o = load();
                  try {
                      JSONArray bs = o.getJSONArray("bills");
                      for (int i = 0; i < bs.length(); i++) {
                          JSONObject b = bs.getJSONObject(i);
                          if (id.equals(b.optString("id"))) {
                              b.put("paid", paid); b.put("assumed", false); b.put("paidDate", paid ? today() : "");
                          }
                      }
                  } catch (Exception ignored) {}
                  save(o);
              }

              public void rename(String key, String name) {
                  JSONObject o = load();
                  try { if (name == null || name.trim().isEmpty()) o.getJSONObject("names").remove(key); else o.getJSONObject("names").put(key, name.trim()); } catch (Exception ignored) {}
                  save(o);
              }

              public void setSub(String key, String state) {
                  JSONObject o = load();
                  try {
                      JSONObject s = new JSONObject(); s.put("s", state); s.put("at", today());
                      o.getJSONObject("subState").put(key, s);
                  } catch (Exception ignored) {}
                  save(o);
              }

              public void deleteBill(String id) {
                  JSONObject o = load();
                  try {
                      JSONArray bs = o.getJSONArray("bills"), nb = new JSONArray();
                      for (int i = 0; i < bs.length(); i++) if (!id.equals(bs.getJSONObject(i).optString("id"))) nb.put(bs.getJSONObject(i));
                      o.put("bills", nb);
                  } catch (Exception ignored) {}
                  save(o);
              }

              /** Bildirim için: ödenmemiş ve son ödemesi 3 gün içinde ya da geçmiş faturalar. */
              public static java.util.List<JSONObject> dueSoon(JSONObject o) {
                  java.util.List<JSONObject> out = new java.util.ArrayList<>();
                  String lim = dayOffset(3);
                  JSONArray bs = o.optJSONArray("bills");
                  if (bs == null) return out;
                  for (int i = 0; i < bs.length(); i++) {
                      JSONObject b = bs.optJSONObject(i);
                      if (b == null || b.optBoolean("paid") || b.optBoolean("noPay")) continue;
                      String d = b.optString("dueDate");
                      if (!d.isEmpty() && d.compareTo(lim) <= 0) out.add(b);
                  }
                  return out;
              }

              public static String nameOf(JSONObject o, JSONObject b) {
                  JSONObject names = o.optJSONObject("names");
                  String k = subKey(b.optString("provider"), b.optString("aboneNo"));
                  if (names != null && names.has(k)) return names.optString(k);
                  String p = b.optString("provider");
                  return p.isEmpty() ? "Fatura" : p;
              }

              static int count(JSONObject o, String k) { JSONArray a = o.optJSONArray(k); return a == null ? 0 : a.length(); }

              @SuppressWarnings("unused")
              static Iterator<String> keys(JSONObject o) { return o.keys(); }
          }
