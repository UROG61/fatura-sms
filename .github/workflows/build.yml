          package com.altintas.faturasms;

          import java.io.BufferedReader;
          import java.io.IOException;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.InetSocketAddress;
          import java.net.Socket;
          import java.nio.charset.StandardCharsets;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;
          import javax.net.ssl.SSLSocket;
          import javax.net.ssl.SSLSocketFactory;

          /** Gmail'e (smtp.gmail.com:465, SSL) mail gönderen küçük SMTP istemcisi. Android'e bağımlı değil. */
          public final class Smtp {
              private Smtp() {}

              public static class SmtpException extends IOException {
                  public final int code;
                  public SmtpException(int code, String msg) { super(msg); this.code = code; }
              }

              public static void send(String host, int port, boolean ssl, String user, String pass,
                                      String to, String subject, String body) throws IOException {
                  Socket s = ssl ? SSLSocketFactory.getDefault().createSocket() : new Socket();
                  try {
                      s.connect(new InetSocketAddress(host, port), 15000);
                      s.setSoTimeout(30000);
                      if (ssl) ((SSLSocket) s).startHandshake();
                      BufferedReader in = new BufferedReader(new InputStreamReader(s.getInputStream(), StandardCharsets.UTF_8));
                      OutputStream out = s.getOutputStream();
                      expect(in, 220);
                      cmd(out, in, "EHLO faturasms.local", 250);
                      if (user != null && !user.isEmpty()) {
                          cmd(out, in, "AUTH LOGIN", 334);
                          cmd(out, in, b64(user.getBytes(StandardCharsets.UTF_8)), 334);
                          cmd(out, in, b64(pass.getBytes(StandardCharsets.UTF_8)), 235);
                      }
                      cmd(out, in, "MAIL FROM:<" + user + ">", 250);
                      cmd(out, in, "RCPT TO:<" + to + ">", 250);
                      cmd(out, in, "DATA", 354);
                      write(out, buildMessage(user, to, subject, body) + "\r\n.\r\n");
                      expect(in, 250);
                      try { write(out, "QUIT\r\n"); } catch (IOException ignored) {}
                  } finally {
                      try { s.close(); } catch (IOException ignored) {}
                  }
              }

              static String buildMessage(String from, String to, String subject, String body) {
                  SimpleDateFormat df = new SimpleDateFormat("EEE, dd MMM yyyy HH:mm:ss Z", Locale.US);
                  StringBuilder m = new StringBuilder();
                  m.append("From: Fatura SMS <").append(from).append(">\r\n");
                  m.append("To: <").append(to).append(">\r\n");
                  m.append("Subject: =?UTF-8?B?").append(b64(subject.getBytes(StandardCharsets.UTF_8))).append("?=\r\n");
                  m.append("Date: ").append(df.format(new Date())).append("\r\n");
                  m.append("Message-ID: <").append(System.currentTimeMillis()).append('.')
                          .append(Math.abs(body.hashCode())).append("@faturasms.local>\r\n");
                  m.append("MIME-Version: 1.0\r\n");
                  m.append("Content-Type: text/plain; charset=UTF-8\r\n");
                  m.append("Content-Transfer-Encoding: base64\r\n\r\n");
                  String enc = b64(body.getBytes(StandardCharsets.UTF_8));
                  for (int i = 0; i < enc.length(); i += 76) {
                      m.append(enc, i, Math.min(enc.length(), i + 76)).append("\r\n");
                  }
                  return m.toString().replaceAll("\r\n$", "");
              }

              private static void cmd(OutputStream out, BufferedReader in, String line, int code) throws IOException {
                  write(out, line + "\r\n");
                  expect(in, code);
              }

              private static void write(OutputStream out, String s) throws IOException {
                  out.write(s.getBytes(StandardCharsets.UTF_8));
                  out.flush();
              }

              private static String expect(BufferedReader in, int code) throws IOException {
                  StringBuilder all = new StringBuilder();
                  String line;
                  do {
                      line = in.readLine();
                      if (line == null) throw new IOException("Sunucu bağlantıyı kapattı");
                      all.append(line).append('\n');
                  } while (line.length() > 3 && line.charAt(3) == '-');
                  int c;
                  try { c = Integer.parseInt(line.substring(0, 3)); } catch (Exception e) { throw new IOException("Geçersiz yanıt: " + line); }
                  boolean ok = c == code || (code == 250 && c == 251);
                  if (!ok) throw new SmtpException(c, all.toString().trim());
                  return all.toString();
              }

              private static final char[] T = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/".toCharArray();

              static String b64(byte[] d) {
                  StringBuilder sb = new StringBuilder((d.length + 2) / 3 * 4);
                  for (int i = 0; i < d.length; i += 3) {
                      int b0 = d[i] & 0xff, b1 = i + 1 < d.length ? d[i + 1] & 0xff : 0, b2 = i + 2 < d.length ? d[i + 2] & 0xff : 0;
                      sb.append(T[b0 >> 2]).append(T[((b0 & 3) << 4) | (b1 >> 4)]);
                      sb.append(i + 1 < d.length ? T[((b1 & 15) << 2) | (b2 >> 6)] : '=');
                      sb.append(i + 2 < d.length ? T[b2 & 63] : '=');
                  }
                  return sb.toString();
              }
          }
