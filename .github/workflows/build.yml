                      JSONObject o = new JSONObject(body);
                      Release r = new Release();
                      String text = o.optString("body", "") + " " + o.optString("name", "");
                      Matcher m = Pattern.compile("versionCode=(\\d+)").matcher(text);
                      if (!m.find()) return null;
                      r.versionCode = Long.parseLong(m.group(1));
                      JSONArray assets = o.optJSONArray("assets");
                      if (assets != null) {
                          for (int i = 0; i < assets.length(); i++) {
                              JSONObject a = assets.getJSONObject(i);
                              if (a.optString("name").endsWith(".apk")) r.apkUrl = a.optString("browser_download_url");
                          }
                      }
                      if (r.apkUrl == null) return null;
                      int nl = o.optString("body", "").indexOf('\n');
                      r.notes = nl > 0 ? o.optString("body").substring(nl + 1).trim() : "";
                      return r;
                  } catch (Exception e) {
                      throw new IOException("Sürüm bilgisi okunamadı");
                  }
              }

              /** APK'yı indirip sistem kurulum ekranını başlatır. */
              public static void downloadAndInstall(Context ctx, String url) throws IOException {
                  Context c = ctx.getApplicationContext();
                  PackageInstaller pi = c.getPackageManager().getPackageInstaller();
                  PackageInstaller.SessionParams params = new PackageInstaller.SessionParams(PackageInstaller.SessionParams.MODE_FULL_INSTALL);
                  params.setAppPackageName(c.getPackageName());
                  int sessionId = pi.createSession(params);
                  PackageInstaller.Session session = pi.openSession(sessionId);
                  try {
                      HttpURLConnection con = open(url, null);
                      int code = con.getResponseCode();
                      if (code != 200) throw new IOException("İndirme hatası: " + code);
                      long len = con.getContentLengthLong();
                      InputStream in = con.getInputStream();
                      OutputStream out = session.openWrite("FaturaSMS.apk", 0, len > 0 ? len : -1);
                      byte[] buf = new byte[65536];
                      int n;
                      while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                      session.fsync(out);
                      out.close();
                      in.close();
                      con.disconnect();

                      Intent i = new Intent(c, InstallReceiver.class);
                      int flags = PendingIntent.FLAG_UPDATE_CURRENT | (Build.VERSION.SDK_INT >= 31 ? PendingIntent.FLAG_MUTABLE : 0);
                      PendingIntent p = PendingIntent.getBroadcast(c, sessionId, i, flags);
                      session.commit(p.getIntentSender());
                  } catch (IOException e) {
                      session.abandon();
                      throw e;
                  } finally {
                      session.close();
                  }
              }

              private static HttpURLConnection open(String url, String accept) throws IOException {
                  // GitHub indirme linkleri başka bir alan adına yönlendirir; yönlendirmeleri elle takip et
                  for (int hop = 0; hop < 6; hop++) {
                      HttpURLConnection con = (HttpURLConnection) new URL(url).openConnection();
                      con.setInstanceFollowRedirects(false);
                      con.setConnectTimeout(15000);
                      con.setReadTimeout(60000);
                      con.setRequestProperty("User-Agent", "FaturaSMS-Android");
                      if (accept != null) con.setRequestProperty("Accept", accept);
                      int code = con.getResponseCode();
                      if (code >= 300 && code < 400) {
                          String loc = con.getHeaderField("Location");
                          con.disconnect();
                          if (loc == null) throw new IOException("Yönlendirme hatası");
                          url = new URL(new URL(url), loc).toString();
                          continue;
                      }
                      return con;
                  }
                  throw new IOException("Çok fazla yönlendirme");
              }

              private static byte[] readAll(InputStream in) throws IOException {
                  ByteArrayOutputStream b = new ByteArrayOutputStream();
                  byte[] buf = new byte[8192];
                  int n;
                  while ((n = in.read(buf)) > 0) b.write(buf, 0, n);
                  in.close();
                  return b.toByteArray();
              }
          }
