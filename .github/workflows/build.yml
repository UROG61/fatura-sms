      - name: Imza anahtarini yerlestir (GitHub Secrets)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo '::error::KEYSTORE_B64 secret eksik. Settings > Secrets and variables > Actions bolumune ekleyin.'; exit 1; fi
          echo "$KEYSTORE_B64" | tr -d ' \n\r' | base64 -d > app/release.keystore

      - name: APK derle
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK adlandir ve surum notu
        run: |
          cp app/build/outputs/apk/release/app-release.apk FaturaSMS.apk
          VC=$((100 + GITHUB_RUN_NUMBER))
          printf 'versionCode=%s\nGuncelleme\n' "$VC" > notes.txt

      - uses: actions/upload-artifact@v4
        with:
          name: FaturaSMS
          path: FaturaSMS.apk

      - name: Surum yayinla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Fatura SMS (son surum)
          body_path: notes.txt
          files: FaturaSMS.apk
          make_latest: true
