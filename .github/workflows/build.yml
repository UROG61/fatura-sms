            var soon=S.reduce(function(s,x){return s+x.open.filter(function(b){var d=days(b.dueDate);return d!=null&&d<=7}).reduce(function(t,b){return t+b.amount},0)},0);
            var h='<div class="hero"><div class="row"><h2>Faturalarım</h2><span class="sub" id="sync">'+syncHtml()+'</span></div><div class="sub" id="lastsync" style="font-size:12px;margin-top:2px">'+lastHtml()+'</div><div class="sub" style="margin-top:4px">'+(cnt?cnt+' ödenmemiş fatura · <b>'+tl(tot)+'</b>':(D.bills.length?'Ödenmemiş fatura görünmüyor 🎉':'Henüz fatura yok'))+'</div></div>';
